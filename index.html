function borrarPersona(id) {
  const p = estado.personas.find(x => x.id === id);
  if (!p) return;
  confirmar("Eliminar persona", `Se eliminará definitivamente a <b>${esc(nomPersona(p))}</b>.
    Si solo quieres ver el efecto de excluirla, usa <b>Desactivar</b>.`, () => {
    estado.personas = estado.personas.filter(x => x.id !== id);
    guardar(); render(); toast("Persona eliminada");
  });
}

/* =====================================================================
   7b. PERSONAL ANTIGUO
   ===================================================================== */

const hoyISO = () => new Date().toISOString().slice(0, 10);

/** Saca a la persona de la composición actual y la manda a Personal antiguo. */
/** Abre el diálogo para dar fin al contrato de una persona. */
function dlgFinContrato(id) {
  const p = estado.personas.find(x => x.id === id);
  if (!p) return;
  const hoy = hoyISO();
  const sugerida = p.fechaFin && p.fechaFin <= hoy ? p.fechaFin : hoy;
  abrirModal("Fin de contrato: " + esc(nomPersona(p)),
    `<div class="hint" style="margin:0 0 14px">La persona saldrá de la composición actual y de
       todos los cálculos. Su ficha, con este cierre y los anteriores, queda en
       <b>Personal antiguo</b>, desde donde puede reincorporarse.</div>
     <div class="grid2">
       <div class="campo"><label>Motivo del fin de contrato</label>
         <select id="fc-motivo">
           <option value="">Elige un motivo...</option>
           ${MOTIVOS_CESE.map(m => `<option${p.motivoCese === m ? " selected" : ""}>${esc(m)}</option>`).join("")}
         </select></div>
       <div class="campo"><label>Fecha de fin de contrato</label>
         <input type="date" id="fc-fecha" value="${esc(p.fechaCese || sugerida)}"></div>
     </div>
     <div class="campo" style="margin-top:14px"><label>Observación (opcional)</label>
       <textarea id="fc-obs" rows="3" placeholder="Contexto del cierre, pendientes, etc."></textarea></div>`,
    `<button class="btn btn-out" onclick="cerrar()">Cancelar</button>
     <button class="btn btn-accion" onclick="finContrato('${id}')">Dar fin al contrato</button>`);
  setTimeout(() => { const el = $("#fc-motivo"); if (el) el.focus(); }, 40);
}

function finContrato(id) {
  const p = estado.personas.find(x => x.id === id);
  if (!p) return;
  const motivo = $("#fc-motivo").value;
  const fecha = $("#fc-fecha").value;
  if (!motivo) { toast("Elige el motivo del fin de contrato", true); return; }
  if (!fecha) { toast("Falta la fecha de fin de contrato", true); return; }
  const obs = $("#fc-obs").value.trim();
  p.motivoCese = motivo;
  p.fechaCese = fecha;
  p.antiguo = true;
  p.fechaAntiguo = hoyISO();
  if (obs) p.observaciones = (p.observaciones ? p.observaciones + "\n" : "") +
                             fechaCorta(fecha) + " (" + motivo + "): " + obs;
  guardar(); cerrar(); render();
  toast(nomPersona(p) + ": contrato cerrado por " + motivo.toLowerCase());
}

/** Guarda el periodo que se cierra en el historial y deja limpio el actual. */
function archivarPeriodo(p) {
  if (!p.fechaInicio && !p.fechaCese && !p.fechaFin && !p.motivoCese) return;
  p.historial = (p.historial || []).concat({
    inicio: p.fechaInicio || "",
    fin: p.fechaCese || p.fechaFin || p.fechaAntiguo || "",
    motivo: p.motivoCese || "",
    modalidad: p.modalidad || "",
    nivelTF: p.modalidad === "TF" ? (p.nivelTF || "") : "",
    coordinacion: nomCoord(p.coordId),
    observacion: ""
  });
  p.fechaInicio = "";
  p.fechaFin = "";
  p.fechaCese = "";
  p.motivoCese = "";
}

/** Devuelve a la persona a la composición actual. */
function reincorporar(id, silencioso) {
  const p = estado.personas.find(x => x.id === id);
  if (!p) return;
  archivarPeriodo(p);
  p.antiguo = false;
  p.activo = true;
  delete p.fechaAntiguo;
  guardar(); render();
  if (!silencioso) {
    toast(nomPersona(p) + " vuelve a la composición actual: completa las fechas del nuevo contrato");
    abrirPersona(id);
  }
}

/* =====================================================================
   8. VISTA RESUMENES
   ===================================================================== */

function tablaResumen(titulo, mapa, etiqueta, orden, nota) {
  const claves = orden || Object.keys(mapa).sort();
  const tot = cero();
  const filas = claves.map(k => {
    const t = mapa[k];
    if (!t) return "";
    acumular2(tot, t);
    return fila(k, t);
  }).join("");
  return `<div class="panel"><div class="panel-cab">${titulo}${
      nota ? `<span class="pill" style="font-weight:500;text-transform:none">${nota}</span>` : ""}</div>
    <div class="tabla-wrap"><table>
      <thead><tr><th>${etiqueta}</th><th class="num">Personas</th>
        <th class="num">TF</th>
        ${CATEGORIAS.map(c => `<th class="num">Prod. ${esc(plural(c))}</th>`).join("")}
        <th class="num">Total productos</th>
        ${MODALIDADES.map(m => `<th class="num">${esc(etiqMod(m))} S/</th>`).join("")}
        <th class="num">Total mensual</th><th class="num">Total anual</th></tr></thead>
      <tbody>${filas || '<tr><td colspan="${CATEGORIAS.length + MODALIDADES.length + 6}" class="nada">Sin datos.</td></tr>'}
        ${filas && !nota ? fila("TOTAL", tot, true) : ""}</tbody>
    </table></div></div>`;
}

function acumular2(dest, src) {
  dest.personas += src.personas; dest.productos += src.productos; dest.ppto += src.ppto;
  CATEGORIAS.forEach(c => dest.prodPorCat[c] = (dest.prodPorCat[c] || 0) + (src.prodPorCat[c] || 0));
  MODALIDADES.forEach(m => {
    dest.pptoPorMod[m] = (dest.pptoPorMod[m] || 0) + (src.pptoPorMod[m] || 0);
    dest.porMod[m] = (dest.porMod[m] || 0) + (src.porMod[m] || 0);
  });
}

function fila(nombre, t, esTotal) {
  return `<tr class="${esTotal ? "total" : ""}"><td>${esc(nombre)}</td>
    <td class="num">${fmtN(t.personas)}</td>
    <td class="num">${fmtN(t.porMod["TF"] || 0)}</td>
    ${CATEGORIAS.map(c => `<td class="num">${fmtN(t.prodPorCat[c] || 0)}</td>`).join("")}
    <td class="num"><b>${fmtN(t.productos)}</b></td>
    ${MODALIDADES.map(m => `<td class="num">${fmtS(t.pptoPorMod[m])}</td>`).join("")}
    <td class="num"><b>${fmtS(t.ppto)}</b></td>
    <td class="num">${fmtS(t.ppto * 12)}</td></tr>`;
}

function pintarResumen(tot) {
  const mapCoord = {}, ordenCoord = [];
  estado.subdirecciones.forEach(s => {
    estado.coordinaciones.filter(c => c.subId === s.id).forEach(c => {
      const et = s.nombre + " / " + c.nombre;
      mapCoord[et] = tot.porCoord[c.id] || cero();
      ordenCoord.push(et);
    });
  });
  const mapSub = {}, ordenSub = [];
  estado.subdirecciones.forEach(s => { mapSub[s.nombre] = tot.porSub[s.id] || cero(); ordenSub.push(s.nombre); });

  const mapCat = {}, ordenCat = [];
  CATEGORIAS.forEach(c => { mapCat[c] = tot.porCat[c] || cero(); ordenCat.push(c); });
  Object.keys(tot.porCat).forEach(c => { if (!mapCat[c]) { mapCat[c] = tot.porCat[c]; ordenCat.push(c); } });

  const mapEti = {}, ordenEti = [];
  estado.etiquetas.forEach(e => { mapEti[e.nombre] = tot.porEti[e.id] || cero(); ordenEti.push(e.nombre); });

  const inact = vigentes().filter(p => !p.activo);
  const aviso = inact.length
    ? `<div class="aviso"><b>${inact.length} persona(s) desactivada(s)</b> no entran en ninguna cifra de
       esta pestaña: ${esc(inact.map(nomPersona).join(", "))}.</div>` : "";

  $("#v-resumen").innerHTML = aviso +
    tablaResumen("Por subdirección", mapSub, "Subdirección", ordenSub) +
    tablaResumen("Por coordinación", mapCoord, "Coordinación", ordenCoord) +
    tablaResumen("Por sector fiscalizado", tot.porSector, "Sector") +
    tablaResumen("Por categoría de carrera", mapCat, "Categoría", ordenCat) +
    (estado.etiquetas.length ? tablaResumen("Por etiqueta", mapEti, "Etiqueta", ordenEti,
       "sin fila de total: una persona puede llevar varias etiquetas") : "");
}

/* =====================================================================
   7c. BUSCADOR (Ctrl+B)
   ===================================================================== */

let busqueda = "";
let indiceResultado = -1;

/** ¿La persona encaja con lo buscado? */
function coincidePersona(p, q) {
  return canon([nomPersona(p), p.carrera, p.categoria, p.sector, p.rol,
                p.modalidad, p.modalidad === "TF" ? "TF " + (p.nivelTF || "") : "",
                nomCoord(p.coordId), nomSub(p.coordId), nomEtiquetas(p),
                p.motivoCese, p.observaciones, p.dni, p.nroContrato,
                (p.jefaturas || []).map(nomCoord).join(" "),
                p.antiguo ? "personal antiguo" : "",
                p.activo ? "" : "desactivado",
                p.motivoInactivo].join(" ")).includes(q);
}

function coincideUnidad(id, q) {
  const c = coordPorId(id);
  if (c) return canon(c.nombre + " " + nomSub(c.id)).includes(q);
  const s = subPorId(id);
  return s ? canon(s.nombre).includes(q) : false;
}

function abrirBuscador() {
  $("#buscador").classList.add("on");
  const el = $("#b-texto");
  el.focus();
  el.select();
}

function cerrarBuscador() {
  $("#buscador").classList.remove("on");
  busqueda = "";
  $("#b-texto").value = "";
  aplicarResaltado();
}

/** Marca en la vista actual todo lo que encaja con la búsqueda. */
function aplicarResaltado() {
  document.querySelectorAll(".resaltado, .resaltado-actual")
    .forEach(e => e.classList.remove("resaltado", "resaltado-actual"));

  const cuenta = $("#b-cuenta");
  const q = canon(busqueda);
  if (!q) {
    if (cuenta) { cuenta.textContent = "Ctrl+B"; cuenta.className = ""; }
    indiceResultado = -1;
    return;
  }

  const ids = new Set(estado.personas.filter(p => coincidePersona(p, q)).map(p => p.id));
  const vistaActiva = $("#v-" + vista);
  if (!vistaActiva) return;

  vistaActiva.querySelectorAll("[data-id]").forEach(e => {
    if (ids.has(e.dataset.id)) e.classList.add("resaltado");
  });
  vistaActiva.querySelectorAll("[data-unidad]").forEach(e => {
    if (coincideUnidad(e.dataset.unidad, q)) e.classList.add("resaltado");
  });

  const hallados = resultados();
  if (cuenta) {
    cuenta.className = hallados.length ? "" : "sin";
    cuenta.textContent = !hallados.length ? "sin resultados"
      : indiceResultado >= 0 ? (indiceResultado + 1) + " de " + hallados.length
      : hallados.length + (hallados.length === 1 ? " resultado" : " resultados");
  }
  if (indiceResultado >= hallados.length) indiceResultado = -1;
  if (indiceResultado >= 0 && hallados[indiceResultado])
    hallados[indiceResultado].classList.add("resaltado-actual");
}

const resultados = () =>
  Array.from(($("#v-" + vista) || document).querySelectorAll(".resaltado, .resaltado-actual"));

/** Salta al resultado siguiente o anterior y lo trae a la vista. */
function irAResultado(paso) {
  const hallados = resultados();
  if (!hallados.length) return;
  indiceResultado = (indiceResultado + paso + hallados.length) % hallados.length;
  hallados.forEach(e => e.classList.remove("resaltado-actual"));
  const el = hallados[indiceResultado];
  el.classList.add("resaltado-actual");
  el.scrollIntoView({ block: "center", inline: "center", behavior: "smooth" });
  const cuenta = $("#b-cuenta");
  if (cuenta) cuenta.textContent = (indiceResultado + 1) + " de " + hallados.length;
}

function alternarRama(id) {

/** Totales de una subdirección sumando los de todas las que dependen de ella. */
function totalRama(id, tot) {
  const acc = cero();
  ramaDeSub(id).forEach(x => { if (tot.porSub[x]) acumular2(acc, tot.porSub[x]); });
  return acc;

function cifrasOrg(t) {

const COLOR_MOD = { TF: "#0f7b4f", CAS: "#2e5496", SERVIR: "#0d6b7a", LOCADOR: "#b25b2a",
                    PRACTICANTE: "#9a6400", SECIGRISTA: "#5b3a8e" };

/** Una persona en el organigrama: una sola línea. */
function lineaOrg(p, coordId) {
  const col = COLOR_MOD[p.modalidad] || "#8b95a6";
  const n = productosEn(p, coordId);
  return `<div class="org-p${p.activo ? "" : " off"}" data-id="${p.id}" ondblclick="abrirPersona('${p.id}')"
      title="${esc(nomPersona(p))} · ${esc(p.modalidad)}${p.nivelTF ? " " + esc(p.nivelTF) : ""} · ${esc(p.categoria || "")} · ${fmtS(p.salario)}">
    <span class="pto" style="background:${col}"></span>
    <span class="nm">${p.rol === "Jefe de equipo" ? "★ " : ""}${esc(nomPersona(p))}</span>
    <span class="mo">${esc(p.modalidad === "TF" && p.nivelTF ? "TF " + p.nivelTF : p.modalidad)}</span>
    ${n ? `<span class="pr">${fmtN(n)}</span>` : ""}

/** Personas de otros equipos que aportan productos a esta coordinación. */
function aportantes(coordId) {
  return vigentes().filter(p => p.activo && p.coordId !== coordId &&
    (p.repartos || []).some(r => r.coordId === coordId && Number(r.productos) > 0));
}

/** Reparte la caja en dos columnas: legales a la izquierda y técnicos a la derecha.
    Los jefes van arriba, a todo lo ancho; las demás categorías, abajo. */
function columnasOrg(gente, aportan) {
  const lado = p => p.categoria === "Legal" ? "izq" : p.categoria === "Técnico" ? "der" : "fin";
  const resto = gente.filter(p => p.rol !== "Jefe de equipo").map(p => ({ p, aporta: false }))
    .concat(aportan.map(p => ({ p, aporta: true })));
  return {
    jefes: gente.filter(p => p.rol === "Jefe de equipo"),
    izq: resto.filter(x => lado(x.p) === "izq"),
    der: resto.filter(x => lado(x.p) === "der"),
    fin: resto.filter(x => lado(x.p) === "fin")
  };
}

function lineaJefeExterno(p) {
  return `<div class="org-p" data-id="${p.id}"
      ondblclick="abrirPersona('${p.id}')"
      title="${esc(nomPersona(p))} dirige este equipo y pertenece a ${esc(nomCoord(p.coordId))}">
      <span class="pto" style="background:#b58900"></span>
      <span class="nm">★ ${esc(nomPersona(p))}</span>
      <span class="mo">de ${esc(nomCoord(p.coordId))}</span></div>`;
}

function lineaAporte(p, coordId) {
  return `<div class="org-p" style="opacity:.75" data-id="${p.id}"
      ondblclick="abrirPersona('${p.id}')"
      title="Pertenece a ${esc(nomCoord(p.coordId))} y aporta productos aquí">
      <span class="pto" style="background:var(--ink3)"></span>
      <span class="nm" style="font-weight:500;font-style:italic">${esc(nomPersona(p))}</span>
      <span class="pr">${fmtN(productosEn(p, coordId))}</span></div>`;
}

function genteEnColumnas(c, gente, aportan) {
  const k = columnasOrg(gente, aportan);
  const lineas = l => l.map(x => x.aporta ? lineaAporte(x.p, c.id) : lineaOrg(x.p, c.id)).join("");
  const columna = (tit, l) => `<div class="org-col">

  return `${k.jefes.map(p => lineaOrg(p, c.id)).join("")}
    <div class="org-cols">${columna("Legales", k.izq)}${columna("Técnicos", k.der)}</div>
    ${k.fin.length ? `<div class="org-col-tit">Otras categorías <b>${fmtN(k.fin.length)}</b></div>${lineas(k.fin)}` : ""}`;
}

function nodoCoordinacion(c, tot) {
  const t = tot.porCoord[c.id] || cero();
  const gente = personasDeCoord(c.id);
  const aportan = aportantes(c.id);
  const dos = estado.org.dosColumnas;

/* ---------------------- filtro de unidades ---------------------------- */

/** Qué deja ver el filtro: null si se ve todo. "ver" son las unidades que se
    dibujan; "completas", aquellas cuyas coordinaciones también se dibujan
    (las elegidas y lo que cuelga de ellas). Las que solo llevan hasta una
    elegida se muestran como camino, sin el resto de su rama. */
function visibilidadOrg() {
  const sel = estado.org.unidades.filter(id => subPorId(id));
  if (!sel.length) return null;
  const ver = new Set(), completas = new Set();
  sel.forEach(id => {
    ramaDeSub(id).forEach(x => { ver.add(x); completas.add(x); });
    let s = subPorId(id);
    while (s && s.padreId) { ver.add(s.padreId); s = subPorId(s.padreId); }
  });
  return { ver, completas };
}

const subsOrg   = (padreId, vis) => hijosDeSub(padreId).filter(s => !vis || vis.ver.has(s.id));
const coordsOrg = (subId, vis) => (vis && !vis.completas.has(subId)) ? []
  : estado.coordinaciones.filter(c => c.subId === subId);

let filtroOrgAbierto = false;

function alternarFiltroOrg(ev) {

document.addEventListener("click", e => {

/* ---------------------- mover coordinaciones -------------------------- */

function activarArrastreOrg() {
  const lienzo = $("#v-organigrama .org-lienzo");
  if (!lienzo) return;
  let idCoord = null;

  const limpiar = () => lienzo.querySelectorAll(".org-nodo.drop, .org-nodo.antes, .org-nodo.despues")
    .forEach(n => n.classList.remove("drop", "antes", "despues"));

  lienzo.querySelectorAll(".org-nodo.coord[draggable]").forEach(el => {
    el.addEventListener("dragstart", e => {
      idCoord = el.dataset.unidad;
      e.dataTransfer.setData("text/plain", idCoord);
      e.dataTransfer.effectAllowed = "move";
      setTimeout(() => el.classList.add("arrastrando"), 0);
    });
    el.addEventListener("dragend", () => { el.classList.remove("arrastrando"); limpiar(); idCoord = null; });
  });

  /** Dónde caería: dentro de una unidad, o antes o después de otra coordinación. */
  const destinoEn = e => {
    const nodo = e.target.closest && e.target.closest(".org-nodo[data-unidad]");
    if (!nodo || nodo.dataset.unidad === idCoord) return null;
    if (nodo.classList.contains("coord")) {
      const r = nodo.getBoundingClientRect();
      return { el: nodo, coord: nodo.dataset.unidad, antes: e.clientX < r.left + r.width / 2 };
    }
    return { el: nodo, sub: nodo.dataset.unidad };
  };

  lienzo.addEventListener("dragover", e => {
    if (!idCoord) return;
    limpiar();
    const d = destinoEn(e);
    if (!d) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    d.el.classList.add(d.coord ? (d.antes ? "antes" : "despues") : "drop");
  });
  lienzo.addEventListener("dragleave", e => { if (!lienzo.contains(e.relatedTarget)) limpiar(); });
  lienzo.addEventListener("drop", e => {
    const d = idCoord ? destinoEn(e) : null;
    limpiar();
    if (!d) return;
    e.preventDefault();
    const id = idCoord;
    idCoord = null;
    moverCoordinacion(id, d);
  });
}

/** Pasa la coordinación a otra unidad o la coloca junto a otra coordinación.
    El orden de estado.coordinaciones es el que siguen todas las vistas. */
function moverCoordinacion(id, destino) {
  const c = coordPorId(id);
  if (!c) return;
  const antes = c.subId;
  const lista = estado.coordinaciones.filter(x => x !== c);
  if (destino.coord) {
    const ref = coordPorId(destino.coord);
    if (!ref) return;
    c.subId = ref.subId;
    lista.splice(lista.indexOf(ref) + (destino.antes ? 0 : 1), 0, c);
  } else {
    if (c.subId === destino.sub) return;   // soltada en su propia unidad: nada cambia
    c.subId = destino.sub;
    lista.push(c);
  }
  estado.coordinaciones = lista;
  guardar(); render();
  const vis = visibilidadOrg();
  toast(c.subId === antes ? `${c.nombre} cambió de lugar`
    : `${c.nombre} pasa a ${nomSub(c.id)}` +
      (vis && !vis.completas.has(c.subId) ? " (queda fuera del filtro)" : ""));
}

function nodoSubdireccion(s, tot, vis) {
  const hijos = subsOrg(s.id, vis);
  const coords = coordsOrg(s.id, vis);
  const t = totalRama(s.id, tot);
  const cerrado = colapsados.has(s.id);
  const nDesc = hijos.length + coords.length;

  const cuerpo = (cerrado || !nDesc) ? "" :
    `<ul>${hijos.map(h => nodoSubdireccion(h, tot, vis)).join("")}${
        coords.map(c => nodoCoordinacion(c, tot)).join("")}</ul>`;

  return `<li>
    <div class="org-nodo ${hijos.length ? "area" : ""}" data-unidad="${s.id}">
      <div class="org-cab">
        <div class="org-nom">${esc(s.nombre)}</div>
        <div class="org-acc">

    </div>
    ${cuerpo}
  </li>`;
}

/* ---------------------- organigrama en PDF ---------------------------- */

/** Cifras de un nodo, ya formateadas, para el PDF. */
function cifrasPdf(t) {
  const conocidos = CATEGORIAS.reduce((s, c) => s + (t.prodPorCat[c] || 0), 0);
  const otros = t.productos - conocidos;
  const filas = [
    ["Personas", fmtN(t.personas)],
    ["TF / CAS", fmtN(t.porMod["TF"] || 0) + " / " + fmtN(t.porMod["CAS"] || 0)]
  ];
  CATEGORIAS.filter(c => (t.prodPorCat[c] || 0) || c === "Técnico" || c === "Legal")
    .forEach(c => filas.push(["Prod. " + plural(c), fmtN(t.prodPorCat[c] || 0)]));
  if (otros) filas.push(["Prod. sin categoría", fmtN(otros)]);
  filas.push(["Total productos", fmtN(t.productos)]);
  filas.push(["Mensual", fmtS(t.ppto)]);
  return filas;
}

/** En dos columnas cada línea lleva "col": izq, der o fin (abajo); sin "col" va arriba. */
function nodoPdfCoord(c, tot) {
  const linea = p => ({
    txt: (p.rol === "Jefe de equipo" ? "* " : "") + nomPersona(p) +
         "  (" + (p.modalidad === "TF" && p.nivelTF ? "TF " + p.nivelTF : p.modalidad) +
         (productosEn(p, c.id) ? ", " + fmtN(productosEn(p, c.id)) + " prod." : "") + ")",
    jefe: p.rol === "Jefe de equipo",
    activo: p.activo
  });
  const aporte = p => ({
    txt: nomPersona(p) + "  (de " + nomCoord(p.coordId) + ", " +
         fmtN(productosEn(p, c.id)) + " prod.)",
    jefe: false, activo: false
  });
  const gente = personasDeCoord(c.id), aportan = aportantes(c.id);
  const nodo = { nombre: c.nombre, tipo: "coord",
                 cifras: cifrasPdf(tot.porCoord[c.id] || cero()), gente: [], hijos: [] };
  if (!estado.org.dosColumnas) {
    nodo.gente = gente.map(linea).concat(aportan.map(aporte));
    return nodo;
  }
  const k = columnasOrg(gente, aportan);
  const conCol = (l, col) => l.map(x => Object.assign(x.aporta ? aporte(x.p) : linea(x.p), { col }));
  nodo.columnas = ["Legales (" + fmtN(k.izq.length) + ")", "Técnicos (" + fmtN(k.der.length) + ")",
                   "Otras categorías (" + fmtN(k.fin.length) + ")"];
  nodo.gente = k.jefes.map(linea)
    .concat(conCol(k.izq, "izq"), conCol(k.der, "der"), conCol(k.fin, "fin"));
  return nodo;
}

function nodoPdfSub(s, tot, vis) {
  const hijos = subsOrg(s.id, vis).map(h => nodoPdfSub(h, tot, vis))
    .concat(coordsOrg(s.id, vis).map(c => nodoPdfCoord(c, tot)));
  return { nombre: s.nombre, tipo: hijosDeSub(s.id).length ? "area" : "unidad",
           cifras: cifrasPdf(totalRama(s.id, tot)), gente: [], hijos };
}

async function organigramaPdf() {
  const tot = calcular();
  const vis = visibilidadOrg();
  const hijos = subsOrg(null, vis).map(s => nodoPdfSub(s, tot, vis));
  if (!vis) estado.coordinaciones.filter(c => !subPorId(c.subId))
    .forEach(c => hijos.push(nodoPdfCoord(c, tot)));
  const elegidas = estado.org.unidades.map(subPorId).filter(Boolean).map(s => s.nombre);

  const datos = {
    titulo: "Organigrama · " + estado.organizacion,
    fecha: "Personal activo al " + fechaCorta(hoyISO()) +
           " · " + fmtN(tot.global.personas) + " personas · " +
           fmtN(tot.global.productos) + " productos · " + fmtS(tot.global.ppto) + " al mes" +
           (vis ? " · Unidades mostradas: " + elegidas.join(", ") : ""),
    raiz: { nombre: estado.organizacion, tipo: "raiz",
            cifras: cifrasPdf(tot.global), gente: [], hijos }
  };

  if (!hayApi) { toast("Disponible en la aplicación de escritorio", true); return; }
  const r = await window.pywebview.api.exportar_organigrama(
    datos, "organigrama_" + hoyISO() + ".pdf");
  if (r.ok) toast("PDF guardado en " + r.ruta);
  else if (!r.cancelado) toast("No se pudo exportar: " + r.error, true);
}

/** Define de qué unidad depende una subdirección. */

  const s = subPorId(id);

  abrirModal("¿De quién depende " + esc(s.nombre) + "?",

       <select id="j-padre">
         <option value="">${esc(estado.organizacion)} (depende directamente)</option>

       </select></div>
     <div class="hint" style="margin-top:10px">No se ofrecen las unidades que cuelgan de
       <b>${esc(s.nombre)}</b>, porque no puede depender de sí misma. Sus coordinaciones y su
       personal se mueven con ella, y las cifras se recalculan solas.</div>`,
    `<button class="btn btn-out" onclick="cerrar()">Cancelar</button>
     <button class="btn btn-accion"
       onclick="guardarJerarquia('${id}')">Guardar</button>`, true);

function guardarJerarquia(id) {
  const padre = $("#j-padre").value || null;
  if (creaCiclo(id, padre)) { toast("Esa unidad depende de la que quieres mover", true); return; }
  subPorId(id).padreId = padre;
  guardar(); cerrar(); render();
  toast(subPorId(id).nombre + " ahora depende de " +
    (padre ? subPorId(padre).nombre : estado.organizacion));
}

function pintarEstructura(tot) {
  let html = `<p class="hint">Aquí defines los equipos. Puedes crear, renombrar, unir y separar
    coordinaciones; el personal se reasigna solo y todos los totales se recalculan.</p>`;

  html += `<div class="panel"><div class="panel-cab">Subdirecciones y coordinaciones
     <div class="der">
       <button class="btn btn-out btn-sm" onclick="dlgSubdireccion()">+ Subdirección</button>
       <button class="btn btn-out btn-sm" onclick="dlgCoordinacion()">+ Coordinación</button>
       <button class="btn btn-out btn-sm" onclick="dlgUnirEquipos()">Unir equipos</button>
     </div></div><div>`;

  if (!estado.subdirecciones.length) html += `<div class="nada">Aún no hay subdirecciones.</div>`;

  // Se recorre la jerarquía: cada unidad se dibuja debajo de la que depende.
  const filaSub = (s, nivel) => {
    const ts = totalRama(s.id, tot);
    const hijos = hijosDeSub(s.id);
    const coords = estado.coordinaciones.filter(c => c.subId === s.id);
    const padre = subPorId(s.padreId);
    html += `<div class="est-fila" data-unidad="${s.id}" style="padding-left:${12 + nivel * 22}px">
      <div><div class="nom">${nivel ? "&#8627; " : ""}${esc(s.nombre)}
        ${hijos.length ? `<span class="pill">${hijos.length} unidad(es) dependiente(s)</span>` : ""}</div>
        <div class="meta">depende de <b>${esc(padre ? padre.nombre : estado.organizacion)}</b>
          &middot; ${ts.personas} activos &middot; ${fmtN(ts.productos)} productos
          &middot; ${fmtS(ts.ppto)} / mes</div></div>
      <div class="acc">
        <button class="btn btn-out btn-sm" onclick="dlgJerarquia('${s.id}')">Depende de</button>
        <button class="btn btn-out btn-sm" onclick="dlgSubdireccion('${s.id}')">Renombrar</button>
        <button class="btn btn-out btn-sm" onclick="dlgCoordinacion(null,'${s.id}')">+ Coordinación</button>
        <button class="btn btn-peligro btn-sm" onclick="borrarSub('${s.id}')">Eliminar</button>
      </div></div>`;
    if (!coords.length && !hijos.length) {
      html += `<div class="est-fila" style="padding-left:${34 + nivel * 22}px">
        <div class="meta">Sin coordinaciones.</div></div>`;
    }
    coords.forEach(c => {
      const tc = tot.porCoord[c.id] || cero();
      const n = vigentes().filter(p => p.coordId === c.id).length;
      html += `<div class="est-fila" data-unidad="${c.id}" style="padding-left:${34 + nivel * 22}px">
        <div><div class="nom">${esc(c.nombre)}</div>
          <div class="meta">${n} persona(s) &middot; ${fmtN(tc.productos)} productos &middot; ${fmtS(tc.ppto)} / mes</div></div>
        <div class="acc">
          <button class="btn btn-out btn-sm" onclick="dlgCoordinacion('${c.id}')">Editar</button>
          <button class="btn btn-out btn-sm" onclick="dlgSepararEquipo('${c.id}')">Separar</button>
          <button class="btn btn-peligro btn-sm" onclick="borrarCoord('${c.id}')">Eliminar</button>
        </div></div>`;
    });
    hijos.forEach(h => filaSub(h, nivel + 1));
  };
  raicesSub().forEach(s => filaSub(s, 0));

  const huerfanas = estado.coordinaciones.filter(c => !subPorId(c.subId));
  if (huerfanas.length) {
    html += `<div class="est-fila" style="background:var(--rojo-bg)">
      <div><div class="nom" style="color:var(--rojo)">Coordinaciones sin subdirección</div>
        <div class="meta">No aparecen en el Kanban hasta que les asignes una.</div></div></div>`;
    huerfanas.forEach(c => {
      const tc = tot.porCoord[c.id] || cero();
      const n = vigentes().filter(p => p.coordId === c.id).length;
      html += `<div class="est-fila sangria">
        <div><div class="nom">${esc(c.nombre)}</div>
          <div class="meta">${n} persona(s) &middot; ${fmtN(tc.productos)} productos</div></div>
        <div class="acc">
          <button class="btn btn-out btn-sm" onclick="dlgCoordinacion('${c.id}')">Asignar subdirección</button>
          <button class="btn btn-peligro btn-sm" onclick="borrarCoord('${c.id}')">Eliminar</button>
        </div></div>`;
    });
  }
  html += `</div></div>`;

  html += `<div class="panel"><div class="panel-cab">Sectores fiscalizados
      <div class="der"><button class="btn btn-out btn-sm" onclick="dlgSector()">+ Sector</button></div></div><div>`;
  if (!estado.sectores.length) html += `<div class="nada">Sin sectores definidos.</div>`;
  estado.sectores.forEach((sec, i) => {
    const n = vigentes().filter(p => p.sector === sec).length;
    html += `<div class="est-fila"><div><div class="nom">${esc(sec)}</div>
      <div class="meta">${n} persona(s)</div></div>
      <div class="acc">
        <button class="btn btn-out btn-sm" onclick="dlgSector(${i})">Renombrar</button>
        <button class="btn btn-peligro btn-sm" onclick="borrarSector(${i})">Eliminar</button>
      </div></div>`;
  });
  html += `</div></div>`;

  html += `<div class="panel"><div class="panel-cab">Etiquetas
      <div class="der"><button class="btn btn-out btn-sm" onclick="dlgEtiqueta()">+ Etiqueta</button></div></div><div>`;
  if (!estado.etiquetas.length) {
    html += `<div class="nada">Sin etiquetas. Sirven para marcar grupos propios
      (por ejemplo "No renovación agosto") sin alterar ningún cálculo.</div>`;
  }
  estado.etiquetas.forEach(e => {
    const te = tot.porEti[e.id] || cero();
    const n = vigentes().filter(p => (p.etiquetas || []).includes(e.id)).length;
    const inact = vigentes().filter(p => (p.etiquetas || []).includes(e.id) && !p.activo).length;
    const col = colorEti(e.color);
    html += `<div class="est-fila">
      <div><div class="nom">
        <span class="chip chip-eti" style="background:${col.bg};color:${col.fg};border-color:${col.bd}">${esc(e.nombre)}</span></div>
        <div class="meta">${n} persona(s)${inact ? ` (${inact} desactivada/s)` : ""} &middot;
          ${fmtN(te.productos)} productos &middot; ${fmtS(te.ppto)} / mes &middot; ${fmtS(te.ppto * 12)} / año</div></div>
      <div class="acc">
        <button class="btn btn-out btn-sm" onclick="dlgAsignarEtiqueta('${e.id}')">Asignar personal</button>
        <button class="btn btn-out btn-sm" onclick="dlgEtiqueta('${e.id}')">Editar</button>
        <button class="btn btn-peligro btn-sm" onclick="borrarEtiqueta('${e.id}')">Eliminar</button>
      </div></div>`;
  });
  html += `</div></div>`;

  $("#v-estructura").innerHTML = html;
}

  if ((e.ctrlKey || e.metaKey) && (e.key === "b" || e.key === "B")) {
    e.preventDefault();
    abrirBuscador();
    return;
  }
  if (e.key === "Escape") {
    if ($("#velo").classList.contains("on")) cerrar();
    else if ($("#buscador").classList.contains("on")) cerrarBuscador();
    return;
  }
  if (e.key === "Enter" && document.activeElement === $("#b-texto")) {
    e.preventDefault();
    irAResultado(e.shiftKey ? -1 : 1);
  }
});

        <input type="date" id="p-retorno" value="${esc(v.fechaRetorno || "")}"></div>

    <div class="hint" style="margin:6px 0 0"><b>Personal antiguo</b>: ya salió del área. Sale de la
      composición actual y de todos los cálculos, y su ficha queda archivada en la pestaña
      Personal antiguo. Al marcarlo hay que indicar el motivo y la fecha del fin de contrato.</div>

    <div id="bloque-cese" class="grid2" style="margin-top:12px">
      <div class="campo"><label>Motivo del fin de contrato</label>
        <select id="p-motivo">
          <option value="">Elige un motivo...</option>
          ${MOTIVOS_CESE.map(m => `<option${v.motivoCese === m ? " selected" : ""}>${esc(m)}</option>`).join("")}

      <div class="campo"><label>Fecha de fin de contrato</label>

    <div class="grid3" style="margin-top:12px">

      <div class="campo"><label>Celular</label>
        <input type="text" id="p-celular" maxlength="20" value="${esc(v.celular || "")}"></div>
      <div class="campo"><label>Usuario INAF</label><select id="p-inaf">
        ${["", "SI", "NO", "PENDIENTE", "ACCESO RETIRADO"].map(x =>
          `<option value="${x}"${(v.usuarioInaf || "") === x ? " selected" : ""}>${x || "(sin dato)"}</option>`).join("")}
        </select></div>
    </div>
    <div class="grid3" style="margin-top:12px">
      <div class="campo"><label>N° de contrato</label>
        <input type="text" id="p-contrato" maxlength="30" value="${esc(v.nroContrato || "")}" placeholder="1141-2025"></div>
      <div class="campo"><label>Teletrabajo</label>

      <div class="campo"><label>Año de ingreso al área</label>
        <input type="text" id="p-anioing" maxlength="4" value="${esc(v.anioIngreso || "")}" placeholder="2019"></div>
    </div>

    <div class="campo" style="margin-top:14px"><label>Observaciones</label>
      <textarea id="p-obs" rows="3" placeholder="Notas libres sobre la persona: acuerdos, pendientes, contexto...">${esc(v.observaciones || "")}</textarea></div>

    ${bloqueHistorial(v)}
    <div class="campo" style="margin-top:14px">
      <label>Productos en otras coordinaciones</label>
      <div class="hint" style="margin:2px 0 8px">Solo si la persona entrega parte de sus
        productos a otro equipo. Lo que no repartas se queda en su coordinación.
        El sueldo siempre se carga completo a la coordinación principal.</div>
      <div id="rep-lista"></div>
      <button type="button" class="btn btn-out btn-sm" onclick="agregarReparto()">+ Otra coordinación</button>

        dirige. Aparecerá en la cabecera de cada uno, pero su sueldo y su gente se cuentan
        una sola vez, en su coordinación principal.</div>
      ${estado.coordinaciones.length > 1
        ? `<div class="lista-chk" style="max-height:170px">${estado.coordinaciones.map(c =>
            `<label data-coord="${c.id}"><input type="checkbox" class="p-jef" value="${c.id}"
               ${(v.jefaturas || []).includes(c.id) ? "checked" : ""}>
               <span>${esc(nomSub(c.id))} / ${esc(c.nombre)}</span></label>`).join("")}</div>`
        : `<div class="hint" style="margin:4px 0 0">Hace falta más de una coordinación.</div>`}
    </div>

    <div class="campo" style="margin-top:14px"><label>Etiquetas</label>
      ${estado.etiquetas.length
        ? `<div class="lista-chk" style="max-height:150px">${estado.etiquetas.map(e => {
            const col = colorEti(e.color);
            return `<label><input type="checkbox" class="p-eti" value="${e.id}"
              ${(v.etiquetas || []).includes(e.id) ? "checked" : ""}>
              <span class="pto" style="background:${col.fg}"></span>
              <span>${esc(e.nombre)}</span></label>`;

        : `<div class="hint" style="margin:4px 0 0">Aún no hay etiquetas. Se crean en la pestaña

  abrirModal(id ? "Editar persona" : "Nueva persona", cuerpo,
    `${id ? `<button class="btn btn-peligro" onclick="cerrar();borrarPersona('${id}')">Eliminar</button>` : ""}
     ${id && !v.antiguo ? `<button class="btn btn-out" onclick="cerrar();dlgFinContrato('${id}')">Dar fin al contrato</button>` : ""}
     <button class="btn btn-out" onclick="cerrar()">Cancelar</button>
     <button class="btn btn-accion" onclick="guardarPersona('${id || ""}')">Guardar</button>`);
  camposTF();
  camposCese();
  camposInactivo();
  camposJefaturas();
  pintarReparto((v.repartos || []).map(r => ({ coordId: r.coordId, productos: r.productos })));
  setTimeout(() => { const el = $("#p-nombre"); if (el) el.focus(); }, 40);
}

/* ------------------- reparto de productos en la ficha ------------------ */

function pintarReparto(filas) {
  const cont = $("#rep-lista");
  if (!cont) return;
  const propia = $("#p-coord").value;
  const opciones = estado.coordinaciones.filter(c => c.id !== propia);
  cont.innerHTML = filas.map((f, i) => `<div class="rep-fila">
      <select class="rep-coord" onchange="pintarResto()">
        ${opciones.map(c => `<option value="${c.id}"${f.coordId === c.id ? " selected" : ""}
          >${esc(nomSub(c.id))} / ${esc(c.nombre)}</option>`).join("")}
      </select>
      <input type="number" class="rep-cant" min="0" step="1"
        value="${Number(f.productos) || 0}" oninput="pintarResto()">
      <button type="button" class="ic" title="Quitar"
        onclick="quitarReparto(${i})">&times;</button>
    </div>`).join("");
  pintarResto();
}

const filasReparto = () =>
  Array.from(document.querySelectorAll(".rep-fila")).map(f => ({
    coordId: f.querySelector(".rep-coord").value,
    productos: Math.max(0, Number(f.querySelector(".rep-cant").value) || 0)
  }));

function agregarReparto() {
  const propia = $("#p-coord").value;
  const libres = estado.coordinaciones.filter(c => c.id !== propia);
  if (!libres.length) { toast("No hay otra coordinación a la que repartir", true); return; }
  pintarReparto(filasReparto().concat({ coordId: libres[0].id, productos: 0 }));
}

function quitarReparto(i) {
  const f = filasReparto();
  f.splice(i, 1);
  pintarReparto(f);
}

/** Muestra cuántos productos quedan en la coordinación propia. */
function pintarResto() {
  const caja = $("#rep-resto");
  if (!caja) return;
  const total = Math.max(0, Number($("#p-prod").value) || 0);
  const cedidos = filasReparto().reduce((s, f) => s + f.productos, 0);
  const resto = total - cedidos;
  const propia = $("#p-coord").value;
  caja.className = "rep-resto" + (resto < 0 ? " mal" : "");
  caja.innerHTML = resto < 0
    ? `Estás repartiendo <b>${fmtN(cedidos)}</b> de un total de <b>${fmtN(total)}</b>:
       sobran ${fmtN(-resto)}.`
    : `Se quedan en <b>${esc(propia ? nomCoord(propia) : "(sin coordinación)")}</b>:
       <b>${fmtN(resto)}</b> de ${fmtN(total)}.`;
}

/** El motivo y la fecha de cese solo se piden si la persona es antigua. */
function camposCese() {
  const b = $("#bloque-cese");
  if (b) b.style.display = $("#p-antiguo").checked ? "" : "none";
}

/** El motivo de la desactivación solo se pide si la persona no cuenta. */
function camposInactivo() {
  const fuera = !$("#p-activo").checked;
  ["#bloque-inactivo", "#hint-inactivo"].forEach(s => {
    const b = $(s); if (b) b.style.display = fuera ? "" : "none";
  });
}

/** La coordinación propia no puede figurar además como jefatura adicional. */
function camposJefaturas() {
  const propia = $("#p-coord") ? $("#p-coord").value : "";
  document.querySelectorAll("#bloque-jefaturas label[data-coord]").forEach(l => {
    const suya = l.getAttribute("data-coord") === propia;
    l.style.display = suya ? "none" : "";
    if (suya) l.querySelector(".p-jef").checked = false;
  });
}

/** Periodos anteriores de contrato de la persona, de solo lectura. */
function bloqueHistorial(v) {
  const h = v.historial || [];
  const actual = v.fechaInicio || v.fechaFin || v.motivoCese
    ? `<tr>
        <td>${fechaCorta(v.fechaInicio) || "-"}</td>
        <td>${fechaCorta(v.fechaCese || (v.antiguo ? v.fechaFin : "")) || (v.antiguo ? "-" : "vigente")}</td>
        <td>${esc(v.motivoCese || (v.antiguo ? "-" : "en curso"))}</td>
        <td>${esc(v.modalidad || "")}${v.modalidad === "TF" && v.nivelTF ? " " + esc(v.nivelTF) : ""}</td>
        <td>${esc(v.coordId ? nomCoord(v.coordId) : "")}</td>
        <td><span class="pill">${v.antiguo ? "cerrado" : "actual"}</span></td></tr>`
    : "";
  if (!h.length && !actual) return "";
  return `<div class="campo" style="margin-top:14px"><label>Historial de contratos</label>
    <div class="panel" style="margin:4px 0 0"><div class="tabla-wrap"><table>
      <thead><tr><th>Inicio</th><th>Fin</th><th>Motivo</th><th>Modalidad</th>
        <th>Coordinación</th><th></th></tr></thead>
      <tbody>${h.map(x => `<tr>
        <td>${fechaCorta(x.inicio) || "-"}</td>
        <td>${fechaCorta(x.fin) || "-"}</td>
        <td>${esc(x.motivo || "-")}</td>
        <td>${esc(x.modalidad)}${x.nivelTF ? " " + esc(x.nivelTF) : ""}</td>
        <td>${esc(x.coordinacion)}</td>
        <td>${x.observacion ? `<span class="pill" title="${esc(x.observacion)}">nota</span>` : ""}</td></tr>`).join("")}
      ${actual}</tbody></table></div></div>
    <div class="hint" style="margin:6px 0 0">Cada vez que la persona se reincorpora, el periodo
      que terminó pasa a esta lista y las fechas de arriba quedan libres para el contrato nuevo.</div>
  </div>`;
}

/** Si cambia la coordinación principal, se quita de la lista de reparto. */
function alCambiarCoord() {
  const propia = $("#p-coord").value;
  pintarReparto(filasReparto().filter(f => f.coordId !== propia));
  camposJefaturas();
}

function camposTF() {
  // El nivel solo aplica a los TF; los productos se registran en toda modalidad.
  $("#c-nivel").style.visibility = $("#p-mod").value === "TF" ? "visible" : "hidden";
}

function guardarPersona(id) {
  const nombre = $("#p-nombre").value.trim();
  const apellido = $("#p-apellido").value.trim();
  if (!nombre && !apellido) { toast("Falta el nombre", true); return; }
  const cedidos = filasReparto().reduce((s, f) => s + f.productos, 0);
  if (cedidos > Math.max(0, Number($("#p-prod").value) || 0)) {
    toast("El reparto suma más productos de los que tiene la persona", true); return;
  }
  const mod = $("#p-mod").value;
  const datos = {
    nombre, apellido, modalidad: mod,
    nivelTF: mod === "TF" ? $("#p-nivel").value : "",
    productos: Math.max(0, Number($("#p-prod").value) || 0),
    salario: Math.max(0, Number($("#p-salario").value) || 0),
    carrera: $("#p-carrera").value.trim(),
    categoria: $("#p-cat").value,
    sector: $("#p-sector").value,
    coordId: $("#p-coord").value || null,
    rol: $("#p-rol").value,
    fechaInicio: $("#p-ini").value,
    fechaFin: $("#p-fin").value,
    activo: $("#p-activo").checked,
    antiguo: $("#p-antiguo").checked,
    motivoCese: $("#p-antiguo").checked ? $("#p-motivo").value : "",
    fechaCese: $("#p-antiguo").checked ? $("#p-cese").value : "",
    motivoInactivo: $("#p-activo").checked ? "" : $("#p-motinac").value,
    fechaRetorno: $("#p-activo").checked ? "" : $("#p-retorno").value,
    observaciones: $("#p-obs").value.trim(),
    dni: $("#p-dni").value.trim(),
    celular: $("#p-celular").value.trim(),
    usuarioInaf: $("#p-inaf").value,
    nroContrato: $("#p-contrato").value.trim(),
    teletrabajo: $("#p-teletrabajo").value.trim(),
    anioIngreso: $("#p-anioing").value.trim(),
    repartos: filasReparto().filter(f => f.productos > 0 && f.coordId !== ($("#p-coord").value || null)),
    jefaturas: Array.from(document.querySelectorAll(".p-jef:checked")).map(e => e.value)
      .filter(c => c !== ($("#p-coord").value || null)),
    etiquetas: Array.from(document.querySelectorAll(".p-eti:checked")).map(e => e.value)
  };
  if (datos.dni) {
    const otro = estado.personas.find(x => x.id !== id && (x.dni || "") === datos.dni);
    if (otro) { toast("El DNI " + datos.dni + " ya está en la ficha de " + nomPersona(otro), true); return; }
  }
  if (datos.antiguo && !datos.motivoCese) { toast("Indica el motivo del fin de contrato", true); return; }
  if (datos.antiguo && !datos.fechaCese) { toast("Indica la fecha de fin de contrato", true); return; }
  if (datos.antiguo) datos.fechaAntiguo = (id && (estado.personas.find(x => x.id === id) || {}).fechaAntiguo) || hoyISO();

  // Al registrar a alguien nuevo, avisar si ya existe una ficha con ese nombre.
  if (!id) {
    const gemelo = buscarHomonimo(nombre, apellido, null);
    if (gemelo) { avisarHomonimo(gemelo, datos); return; }
  }

  if (id) Object.assign(estado.personas.find(x => x.id === id), datos);
  else estado.personas.push(Object.assign({ id: uid() }, datos));
  guardar(); cerrar(); render();
  toast(id ? "Cambios guardados" : "Persona agregada");
}

/* ------------------- aviso de nombre ya registrado -------------------- */

let datosPendientes = null;

function avisarHomonimo(gemelo, datos) {
  datosPendientes = datos;
  const donde = gemelo.antiguo ? "personal antiguo"
    : `la composición actual, en <b>${esc(nomCoord(gemelo.coordId))}</b>`;
  const ficha = `<div class="panel" style="margin:10px 0 0">
      <div class="tabla-wrap"><table><tbody>
        <tr><td>Modalidad</td><td><b>${esc(gemelo.modalidad)}${
          gemelo.modalidad === "TF" && gemelo.nivelTF ? " " + esc(gemelo.nivelTF) : ""}</b></td></tr>
        <tr><td>Carrera / categoría</td><td><b>${esc(gemelo.carrera || "-")} · ${esc(gemelo.categoria || "-")}</b></td></tr>
        <tr><td>Última coordinación</td><td><b>${esc(nomCoord(gemelo.coordId))}</b></td></tr>
        <tr><td>Contrato</td><td><b>${fechaCorta(gemelo.fechaInicio) || "-"} a ${fechaCorta(gemelo.fechaFin) || "-"}</b></td></tr>
        ${gemelo.antiguo ? `<tr><td>Fin de contrato</td><td><b>${fechaCorta(gemelo.fechaCese || gemelo.fechaAntiguo) || "-"}</b>${
            gemelo.motivoCese ? " · " + esc(gemelo.motivoCese) : ""}</td></tr>` : ""}
        ${(gemelo.historial || []).length ? `<tr><td>Periodos anteriores</td><td><b>${gemelo.historial.length}</b></td></tr>` : ""}
      </tbody></table></div></div>`;

  if (gemelo.antiguo) {
    abrirModal("Esa persona ya está registrada",
      `<div class="aviso"><b>${esc(nomPersona(gemelo))}</b> ya existe en ${donde}.
         No hace falta volver a registrarla: basta con quitarle la condición de antiguo
         para que vuelva a la composición actual con toda su ficha y sus etiquetas.</div>
       ${ficha}`,
      `<button class="btn btn-out" onclick="cerrar()">Cancelar</button>
       <button class="btn btn-out" onclick="crearDePendientes()">Es otra persona: registrar igual</button>
       <button class="btn btn-out" onclick="reincorporarGemelo('${gemelo.id}', false)">Reincorporar sin cambios</button>
       <button class="btn btn-accion"
         onclick="reincorporarGemelo('${gemelo.id}', true)">Reincorporar y actualizar</button>`);
  } else {
    abrirModal("Ya hay alguien con ese nombre",
      `<div class="aviso"><b>${esc(nomPersona(gemelo))}</b> ya figura en ${donde}.
         Si es la misma persona, cancela y edita su ficha en vez de crear una segunda.</div>
       ${ficha}`,
      `<button class="btn btn-out" onclick="cerrar()">Cancelar</button>
       <button class="btn btn-accion"
         onclick="crearDePendientes()">Es otra persona: registrar igual</button>`);
  }
}

/** Crea la ficha nueva a pesar del homónimo, con los datos ya capturados del formulario. */
function crearDePendientes() {
  if (!datosPendientes) { cerrar(); return; }
  estado.personas.push(Object.assign({ id: uid() }, datosPendientes));
  datosPendientes = null;
  guardar(); cerrar(); render();
  toast("Persona agregada como ficha aparte");
}

/** Devuelve al gemelo a la composición actual, con o sin los datos recién escritos. */
function reincorporarGemelo(id, actualizar) {
  const g = estado.personas.find(x => x.id === id);
  if (!g) return;
  // El periodo que termino pasa al historial antes de abrir el nuevo.
  archivarPeriodo(g);
  if (actualizar && datosPendientes) {
    // las etiquetas y el historial que ya tenía se conservan
    const previas = g.etiquetas || [];
    const historial = g.historial || [];
    const obsPrevias = g.observaciones || "";
    Object.assign(g, datosPendientes);
    g.etiquetas = Array.from(new Set(previas.concat(datosPendientes.etiquetas || [])));
    g.historial = historial;
    if (obsPrevias && !g.observaciones) g.observaciones = obsPrevias;
    g.motivoCese = ""; g.fechaCese = "";
  }
  g.antiguo = false;
  g.activo = true;
  delete g.fechaAntiguo;
  datosPendientes = null;
  guardar(); cerrar(); render();
  toast(nomPersona(g) + " vuelve a la composición actual" + (actualizar ? " con los datos nuevos" : ""));
  if (!actualizar) abrirPersona(id);
}

/* ------------------------------ estructura ---------------------------- */

function dlgSubdireccion(id) {
  const s = id ? subPorId(id) : null;
  abrirModal(s ? "Renombrar subdirección" : "Nueva subdirección",
    `<div class="campo"><label>Nombre</label>
      <input type="text" id="s-nom" value="${esc(s ? s.nombre : "")}" placeholder="SFEM"></div>
     ${s ? "" : `<div class="campo" style="margin-top:12px"><label>Depende de</label>
       <select id="s-padre">
         <option value="">${esc(estado.organizacion)}</option>
         ${estado.subdirecciones.map(x => `<option value="${x.id}">${esc(x.nombre)}</option>`).join("")}
       </select></div>`}`,
    `<button class="btn btn-out" onclick="cerrar()">Cancelar</button>
     <button class="btn btn-accion" onclick="guardarSub('${id || ""}')">Guardar</button>`, true);
  setTimeout(() => { const el = $("#s-nom"); if (el) el.focus(); }, 40);
}

function guardarSub(id) {
  const n = $("#s-nom").value.trim();
  if (!n) { toast("Falta el nombre", true); return; }
  if (id) subPorId(id).nombre = n;
  else estado.subdirecciones.push({ id: uid(), nombre: n,
    padreId: ($("#s-padre") || {}).value || null });
  guardar(); cerrar(); render(); toast("Subdirección guardada");
}

function borrarSub(id) {
  const s = subPorId(id);
  const coords = estado.coordinaciones.filter(c => c.subId === id);
  confirmar("Eliminar subdirección",
    `Se eliminará <b>${esc(s.nombre)}</b> y sus ${coords.length} coordinación(es).
     El personal de esas coordinaciones quedará <b>sin coordinación asignada</b> (no se borra a nadie).
     ${hijosDeSub(id).length ? `Las ${hijosDeSub(id).length} unidad(es) que dependen de ella pasarán a
       depender de <b>${esc((subPorId(s.padreId) || {}).nombre || estado.organizacion)}</b>.` : ""}`,
    () => {
      const ids = coords.map(c => c.id);
      estado.personas.forEach(p => {
        if (ids.includes(p.coordId)) p.coordId = null;
        p.repartos = (p.repartos || []).filter(r => !ids.includes(r.coordId));
      });
      estado.coordinaciones = estado.coordinaciones.filter(c => c.subId !== id);

  abrirModal("Unir equipos",

     <div class="grid2">

function unirEquipos() {
  const a = $("#u-a").value, b = $("#u-b").value, nuevo = $("#u-nom").value.trim();
  if (a === b) { toast("Elige dos coordinaciones distintas", true); return; }
  const ca = coordPorId(a), cb = coordPorId(b);
  const n = vigentes().filter(p => p.coordId === a).length;
  estado.personas.forEach(p => {
    if (p.coordId === a) p.coordId = b;
    p.repartos = (p.repartos || []).map(r => r.coordId === a ? { ...r, coordId: b } : r);
    // La jefatura de la coordinacion que desaparece pasa a la que queda.
    p.jefaturas = (p.jefaturas || []).map(j => j === a ? b : j)
      .filter((j, i, l) => j !== p.coordId && l.indexOf(j) === i);
  });
  estado.coordinaciones = estado.coordinaciones.filter(c => c.id !== a);
  if (nuevo) cb.nombre = nuevo;
  guardar(); cerrar(); render();
  toast(`${ca.nombre} se unió a ${cb.nombre} (${n} persona(s))`);
}

function guardarAsignacion(id) {

    if (!debe && tiene) p.etiquetas = p.etiquetas.filter(x => x !== id);
  });
  guardar(); cerrar(); render();
  toast(`${etiPorId(id).nombre}: ${marcados.length} persona(s) etiquetada(s)`);
}

/* =====================================================================
   11. EXPORTAR / RESPALDAR
   ===================================================================== */

function hojasExcel() {
  const tot = calcular();

  const personal = {
    nombre: "Personal",
    columnas: ["Nombre", "Apellido", "Modalidad", "Nivel TF", "Productos entregable",
               "Salario mensual", "Salario anual", "Carrera exacta", "Categoría",
               "Sector fiscalizado", "Coordinación", "Subdirección",
               "Inicio contrato", "Fin contrato", "Rol", "Cuenta en cálculos",
               "Motivo de desactivación", "Retorno previsto",
               "DNI", "Celular", "Usuario INAF", "N° de contrato", "Teletrabajo",
               "Año de ingreso", "Jefatura de otros equipos",
               "Reparto de productos", "Observaciones", "Etiquetas"].concat(estado.etiquetas.map(e => e.nombre)),
    filas: []
  };

  const porEquipo = (a, b) =>
    nomSub(a.coordId).localeCompare(nomSub(b.coordId)) ||
    nomCoord(a.coordId).localeCompare(nomCoord(b.coordId)) ||
    nomPersona(a).localeCompare(nomPersona(b));

  const filaPersona = p => [
    p.nombre, p.apellido, p.modalidad, p.modalidad === "TF" ? (p.nivelTF || "") : "",
    p.productos,
    p.salario, p.salario * 12, p.carrera || "", p.categoria || "", p.sector || "",
    nomCoord(p.coordId), nomSub(p.coordId),
    fechaCorta(p.fechaInicio), fechaCorta(p.fechaFin), p.rol || "", p.activo ? "SI" : "NO",
    p.activo ? "" : (p.motivoInactivo || ""), p.activo ? "" : fechaCorta(p.fechaRetorno),
    p.dni || "", p.celular || "", p.usuarioInaf || "", p.nroContrato || "",
    p.teletrabajo || "", p.anioIngreso || "",
    (p.jefaturas || []).map(nomCoord).join("; "),
    tieneReparto(p) ? repartoDe(p).filter(x => x.productos > 0)
        .map(x => nomCoord(x.coordId) + ": " + x.productos).join("; ") : "",
    p.observaciones || "",
    nomEtiquetas(p)
  ].concat(estado.etiquetas.map(e => (p.etiquetas || []).includes(e.id) ? "SI" : ""));

  personal.filas = vigentes().sort(porEquipo).map(filaPersona);

  const COLS_RES = ["Grupo", "Personas", "TF"]
    .concat(CATEGORIAS.map(c => "Prod. " + plural(c)))
    .concat(["Total productos"])
    .concat(MODALIDADES.map(m => "Presup. " + etiqMod(m)))
    .concat(["Total mensual", "Total anual"]);

  const filaRes = (nombre, t) => [nombre, t.personas, t.porMod["TF"] || 0]
    .concat(CATEGORIAS.map(c => t.prodPorCat[c] || 0))
    .concat([t.productos])
    .concat(MODALIDADES.map(m => t.pptoPorMod[m] || 0))
    .concat([t.ppto, t.ppto * 12]);

  const hojaRes = (nombre, pares, sinTotal) => {
    const tt = cero();
    const filas = pares.map(([et, t]) => { acumular2(tt, t); return filaRes(et, t); });
    if (!sinTotal) filas.push(filaRes("TOTAL", tt));
    return { nombre, columnas: COLS_RES, filas };
  };

  const paresSub = estado.subdirecciones.map(s => [s.nombre, tot.porSub[s.id] || cero()]);
  const paresCoord = [];
  estado.subdirecciones.forEach(s => {
    estado.coordinaciones.filter(c => c.subId === s.id).forEach(c =>
      paresCoord.push([s.nombre + " / " + c.nombre, tot.porCoord[c.id] || cero()]));
  });
  const paresSector = Object.keys(tot.porSector).sort().map(k => [k, tot.porSector[k]]);
  const paresCat = CATEGORIAS.map(c => [c, tot.porCat[c] || cero()]);
  Object.keys(tot.porCat).forEach(c => {
    if (!CATEGORIAS.includes(c)) paresCat.push([c, tot.porCat[c]]);
  });

  const hojas = [
    personal,
    hojaRes("Por subdirección", paresSub),
    hojaRes("Por coordinación", paresCoord),
    hojaRes("Por sector", paresSector),
    hojaRes("Por categoría", paresCat)
  ];

  // El personal antiguo va aparte: no forma parte de la composición actual.
  const ant = antiguos();
  if (ant.length) {
    hojas.push({
      nombre: "Personal antiguo",
      columnas: personal.columnas.slice(0, 16).concat("Motivo de cese", "Fecha de cese",
                  "Marcado como antiguo", personal.columnas.slice(16)),   // 16 = tras "Cuenta en cálculos"
      filas: ant.sort((a, b) => ((b.fechaCese || b.fechaAntiguo || "")).localeCompare(a.fechaCese || a.fechaAntiguo || "") ||
                                nomPersona(a).localeCompare(nomPersona(b)))
        .map(p => { const f = filaPersona(p);
                    return f.slice(0, 16).concat(p.motivoCese || "", fechaCorta(p.fechaCese),
                                                 fechaCorta(p.fechaAntiguo), f.slice(16)); })
    });
  }

  // Historial: un renglon por cada periodo de contrato ya cerrado.
  const filasHist = [];
  estado.personas.forEach(p => (p.historial || []).forEach((h, i) => filasHist.push([
    p.nombre, p.apellido, i + 1, fechaCorta(h.inicio), fechaCorta(h.fin), h.motivo || "",
    h.modalidad || "", h.nivelTF || "", h.coordinacion || "", h.observacion || "",
    p.antiguo ? "Personal antiguo" : "En la composición actual"
  ])));
  if (filasHist.length) {
    hojas.push({
      nombre: "Historial",
      columnas: ["Nombre", "Apellido", "Periodo", "Inicio", "Fin", "Motivo de cese",
                 "Modalidad", "Nivel TF", "Coordinación", "Observación", "Situación actual"],
      filas: filasHist.sort((a, b) => (a[0] + a[1]).localeCompare(b[0] + b[1]) || a[2] - b[2])
    });
  }

  // Una persona puede llevar varias etiquetas, por eso esta hoja no lleva fila TOTAL.
  if (estado.etiquetas.length) {
    const paresEti = estado.etiquetas.map(e => [e.nombre, tot.porEti[e.id] || cero()]);
    hojas.push(hojaRes("Por etiqueta", paresEti, true));
  }
  return hojas;
}

async function exportarExcel() {
  const hojas = hojasExcel();
  if (!hayApi) { exportarCsv(hojas); return; }
  const hoy = new Date().toISOString().slice(0, 10);
  const r = await window.pywebview.api.exportar_excel({ hojas }, "cuadro_personal_" + hoy + ".xlsx");
  if (r.ok) toast("Excel guardado en " + r.ruta);
  else if (!r.cancelado) toast("No se pudo exportar: " + r.error, true);
}

function exportarCsv(hojas) {
  const lineas = [];
  hojas.forEach(h => {
    lineas.push("### " + h.nombre);
    lineas.push(h.columnas.join(";"));
    h.filas.forEach(f => lineas.push(f.map(v =>
      typeof v === "string" && /[;\n"]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v).join(";")));
    lineas.push("");
  });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + lineas.join("\n")], { type: "text/csv;charset=utf-8" }));
  a.download = "cuadro_personal.csv";
  a.click();
  toast("Exportado como CSV (modo navegador)");
}

/** Texto comparable: sin tildes, sin mayúsculas, sin espacios de más. */
const canon = s => String(s == null ? "" : s).trim().toLowerCase()
  .normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, " ");

/* Encabezados que entiende el importador (los que produce la exportación
   más algunos sinónimos razonables). */
const CAMPOS_IMP = {
  "nombre": "nombre", "nombres": "nombre",
  "apellido": "apellido", "apellidos": "apellido",
  "nombre y apellido": "nombreCompleto", "nombre completo": "nombreCompleto",
  "modalidad": "modalidad",
  "nivel tf": "nivelTF", "nivel": "nivelTF",
  "productos entregable": "productos", "productos": "productos",
  "productos del entregable": "productos",
  "salario mensual": "salario", "salario": "salario",
  "salario anual": "ignorar",
  "carrera exacta": "carrera", "carrera": "carrera",
  "categoria": "categoria",
  "sector fiscalizado": "sector", "sector": "sector",
  "coordinacion": "coord", "ultima coordinacion": "coord",
