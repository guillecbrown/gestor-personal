<style>
:root{
  color-scheme:dark;
  /* Base neutra casi negra; las superficies se levantan con blanco translucido
     en vez de con colores propios. */
  --fondo:#131316;
  --capa-1:rgba(255,255,255,.045);
  --capa-2:rgba(255,255,255,.07);
  --capa-3:rgba(255,255,255,.10);
  --control:rgba(255,255,255,.12);
  --hover:rgba(255,255,255,.08);
  --filo:rgba(255,255,255,.12);
  --filo-suave:rgba(255,255,255,.07);

  /* Un solo blanco calido, en tres niveles de presencia. */
  --ink:rgba(255,255,245,.92);
  --ink2:rgba(255,255,245,.6);
  --ink3:rgba(255,255,245,.4);
  --ink-inv:#1a1a1c;

  --select:#4483f7;
  --amarillo:#ffd60a;
  --verde:#4fd08a;
  --ambar:#e5b64a;
  --rojo:#ff7a7a;
  --morado:#b39ae8;
  --cian:#4fc3d9;
  --teja:#e0895a;

  --sombra:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.36);
  --sombra-alta:0 28px 80px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.4);
  --anillo:inset 0 0 0 1px var(--filo);
  --anillo-suave:inset 0 0 0 1px var(--filo-suave);
  --luz:inset 0 1px 0 rgba(255,255,255,.06);

  --radio:10px; --radio-s:8px; --radio-xs:6px;

  /* Movimiento corto y seco, sin rebotes. */
  --curva:cubic-bezier(.2,0,0,1);
  --curva-suave:cubic-bezier(.35,0,.25,1);

  /* Lo que cambia entre tema oscuro y claro. --rgb-luz es el color con el que
     se levantan las superficies: blanco sobre negro, negro sobre blanco. */
  --rgb-luz:255,255,255;
  --rgb-inv:26,26,28;
  --ink-max:#fff;
  --control-hover:rgba(255,255,255,.18);
  --velo-barra:#131316;
  --velo-modal:rgba(0,0,0,.55);
  --sup-modal:#1c1c20;
  --opcion:#1c1c20; --opcion-on:#2c2c32;
  --esquema:dark;
  --eti-rojo:#ff9a9a; --eti-ambar:#ffd60a; --eti-verde:#6fdca4;
  --eti-azul:#7ba7fa; --eti-morado:#c4b0f0;
}
/* Tema claro: mismo sistema, invertido. Los acentos se oscurecen para que
   se lean sobre fondo blanco. */
:root[data-tema="claro"]{
  color-scheme:light;
  --fondo:#f2f2ef;
  --capa-1:rgba(0,0,0,.03);
  --capa-2:#fff;
  --capa-3:#f6f6f3;
  --control:rgba(0,0,0,.07);
  --hover:rgba(0,0,0,.05);
  --filo:rgba(0,0,0,.13);
  --filo-suave:rgba(0,0,0,.07);

  --ink:rgba(22,22,26,.92);
  --ink2:rgba(22,22,26,.64);
  --ink3:rgba(22,22,26,.46);
  --ink-inv:#fff;

  --select:#2f6fe0;
  --amarillo:#9a7200;
  --verde:#1b8a50;
  --ambar:#a8720c;
  --rojo:#d13b3b;
  --morado:#7552c4;
  --cian:#127c93;
  --teja:#b85a24;

  --sombra:0 1px 2px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.08);
  --sombra-alta:0 28px 80px rgba(0,0,0,.18), 0 8px 24px rgba(0,0,0,.1);
  --luz:inset 0 1px 0 rgba(255,255,255,.7);

  --rgb-luz:0,0,0;
  --rgb-inv:255,255,255;
  --ink-max:#000;
  --control-hover:rgba(0,0,0,.11);
  --velo-barra:#f2f2ef;
  --velo-modal:rgba(20,20,24,.28);
  --sup-modal:#fff;
  --opcion:#fff; --opcion-on:#e6e6e2;
  --esquema:light;
  --eti-rojo:#c43a3a; --eti-ambar:#8f6a00; --eti-verde:#1b7d49;
  --eti-azul:#2a62c9; --eti-morado:#6a48b8;
}
/* En la cabecera el boton principal sigue siendo blanco sobre el degradado. */
:root[data-tema="claro"] header .btn-p{background:rgba(255,255,255,.94);color:#1a1a1c}
:root[data-tema="claro"] header .btn-p:hover{background:#fff}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:Inter,"Segoe UI Variable Text","Segoe UI",-apple-system,"Helvetica Neue",Arial,sans-serif;
  font-feature-settings:"tnum" 1,"cv11" 1;
  background:var(--fondo);color:var(--ink);font-size:13px;
  display:flex;flex-direction:column;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:13px;cursor:pointer;border:0;color:inherit}
input,select,textarea{font-family:inherit;font-size:13px;border:0}

/* ---------------------------------------------------------------- header */
/* Degradado con los colores del logo. */
header{color:#fff;flex:0 0 auto;position:relative;z-index:8;
  background:linear-gradient(100deg,
    #14386e 0%, #1a4c80 30%, #1b568c 52%, #17708e 70%, #157a70 85%, #3d8a45 100%);
  box-shadow:0 1px 0 rgba(0,0,0,.5)}
.hdr-top{display:flex;align-items:center;gap:12px;padding:12px 20px}
.logo{width:26px;height:26px;border-radius:var(--radio-s);flex:0 0 auto;object-fit:cover;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.marca{font-weight:500;font-size:14px;letter-spacing:-.1px;white-space:nowrap}
.marca span{opacity:.55;font-weight:400;font-size:12px;margin-left:10px}
.hdr-acc{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{
  font-size:13px;font-weight:500;border-radius:var(--radio-s);padding:7px 16px;
  background:var(--control);color:var(--ink);white-space:nowrap;
  transition:background-color .15s ease, opacity .15s ease, transform .05s ease;
}
.btn:hover{background:var(--control-hover)}
.btn:active{transform:scale(.98)}
.btn-p{background:var(--ink);color:var(--ink-inv);font-weight:500}
.btn-p:hover{background:var(--ink-max)}
.btn-accion{background:var(--ink);color:var(--ink-inv);font-weight:500}
.btn-accion:hover{background:var(--ink-max)}
.btn-g{background:rgba(255,255,255,.14);color:#fff}
.btn-g:hover{background:rgba(255,255,255,.24)}
.btn-sm{padding:4px 12px;font-size:12px;border-radius:var(--radio-xs)}
.btn-ico{padding:0;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center}
.btn-ico .svg-ic{width:16px;height:16px}
.menu{position:relative}
.menu-lista{display:none;position:absolute;right:0;top:calc(100% + 8px);min-width:188px;z-index:20;
  background:var(--sup-modal);border-radius:var(--radio);padding:4px;
  box-shadow:var(--sombra-alta), var(--anillo)}
.menu.on .menu-lista{display:block;animation:entraBuscador .16s var(--curva) both}
.menu-lista button{display:block;width:100%;text-align:left;background:transparent;color:var(--ink);
  padding:8px 12px;border-radius:var(--radio-xs);font-size:13px}
.menu-lista button:hover{background:var(--hover)}
.menu-sep{height:1px;background:var(--filo-suave);margin:4px 8px}
/* Todos los íconos salen del mismo set de línea. */
.svg-ic{width:14px;height:14px;flex:0 0 auto;display:block}
.btn-out{background:transparent;color:var(--ink2);box-shadow:var(--anillo)}
.btn-out:hover{background:var(--hover);color:var(--ink)}
.btn-peligro{background:transparent;color:var(--rojo);box-shadow:inset 0 0 0 1px rgba(255,122,122,.32)}
.btn-peligro:hover{background:rgba(255,122,122,.12)}
.tabs{display:flex;gap:1px;padding:0 16px}
.tab{
  background:transparent;color:rgba(255,255,255,.62);
  padding:8px 16px;border-radius:var(--radio-s) var(--radio-s) 0 0;
  font-size:13px;font-weight:500;
  transition:color .15s ease, background-color .15s ease;
}
.tab:hover{color:#fff;background:rgba(255,255,255,.1)}
.tab.on{background:var(--fondo);color:var(--ink);font-weight:500}
.tab-cnt{background:rgba(255,255,255,.18);border-radius:20px;padding:1px 6px;
  font-size:11px;font-weight:500;font-variant-numeric:tabular-nums}
.tab.on .tab-cnt{background:var(--control);color:var(--ink)}

/* -------------------------------------------------------------- kpi strip */
.kpis{
  display:flex;gap:2px;background:transparent;flex:0 0 auto;
  overflow-x:auto;overflow-y:hidden;padding:12px 8px;gap:8px;
  box-shadow:inset 0 -1px 0 var(--filo-suave);position:relative;z-index:6;
}
.kpi{padding:8px 16px;min-width:180px;border-radius:var(--radio-s);
  transition:background-color .15s ease}
.kpi:hover{background:var(--hover)}
.kpi .k-lbl{font-size:12px;color:var(--ink3)}
.kpi .k-val{font-size:22px;font-weight:500;margin-top:4px;font-variant-numeric:tabular-nums;
  color:var(--ink);letter-spacing:-.4px}
.kpi .k-sub{font-size:12px;color:var(--ink3);margin-top:4px;white-space:nowrap}
.k-baja{color:var(--ambar)}

/* ------------------------------------------------------------------ main */
main{flex:1 1 auto;overflow:auto;padding:0}
.vista{display:none;padding:16px 20px 64px}
.vista.on{display:block;animation:aparece .2s ease both}
@keyframes aparece{from{opacity:0}to{opacity:1}}
.hint{font-size:12px;color:var(--ink3);margin:0 0 16px;line-height:1.5}

/* ---------------------------------------------------------------- kanban */
.sub-bloque{margin-bottom:24px;background:var(--capa-1);border-radius:var(--radio);
  box-shadow:var(--anillo-suave)}
.sub-cab{border-radius:var(--radio) var(--radio) 0 0;display:flex;align-items:center;
  gap:12px;padding:12px 16px;box-shadow:inset 0 -1px 0 var(--filo-suave)}
.sub-nom{font-weight:600;color:var(--ink);font-size:14px;letter-spacing:-.1px}
.sub-mini{display:flex;gap:4px 16px;margin-left:auto;flex-wrap:wrap;
  justify-content:flex-end;align-items:center}
.mini{font-size:12px;color:var(--ink3);white-space:nowrap}
.mini b{color:var(--ink2);font-variant-numeric:tabular-nums;font-weight:500}
.mini-fuerte b{color:var(--ink)}
.cols{display:flex;gap:12px;padding:16px;overflow-x:auto;overflow-y:hidden;
  align-items:flex-start;scrollbar-width:none}
.cols::-webkit-scrollbar{height:0;width:0}

.barra-h{position:sticky;bottom:0;z-index:6;overflow-x:auto;overflow-y:hidden;
  background:var(--velo-barra);
  box-shadow:inset 0 1px 0 var(--filo-suave);
  border-radius:0 0 var(--radio) var(--radio)}
.barra-h.oculta{display:none}
.barra-h > div{height:1px}
.col{
  flex:0 0 272px;background:var(--capa-1);border-radius:var(--radio);
  display:flex;flex-direction:column;box-shadow:var(--anillo-suave);
  transition:box-shadow .2s var(--curva), background-color .2s ease,
             transform .2s var(--curva);
}
.col.drop{background:rgba(68,131,247,.10);transform:translateY(-2px);
  box-shadow:inset 0 0 0 1px var(--select), var(--sombra)}
.col-cab{padding:12px 12px 8px}
.col-nom{font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px;color:var(--ink)}
.col-acc{margin-left:auto;display:flex;align-items:center;gap:2px}
.col-nom .cnt{color:var(--ink3);font-size:12px;font-weight:500;font-variant-numeric:tabular-nums;
  margin-left:4px}
.col-acc .ic{background:transparent;opacity:0;transition:opacity .15s ease, background-color .15s ease}
.col:hover .col-acc .ic{opacity:1}
.col-acc .ic:hover{background:var(--control)}
.ic:disabled,.col:hover .col-acc .ic:disabled{opacity:.25;cursor:default}
.ic:disabled:hover{background:transparent;color:var(--ink2)}
/* Marca donde caera la tarjeta que se esta arrastrando. */
.card.antes{box-shadow:inset 0 2px 0 var(--select)}
.card.despues{box-shadow:inset 0 -2px 0 var(--select)}
/* Resumen de la coordinacion en una linea; el desglose se abre a pedido. */
.col-det{margin-top:4px}
.col-det summary{list-style:none;display:flex;align-items:center;gap:6px;cursor:pointer;
  font-size:12px;color:var(--ink3);padding:4px 0;user-select:none}
.col-det summary::-webkit-details-marker{display:none}
.col-det summary b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.col-det summary .svg-ic{width:12px;height:12px;margin-left:auto;opacity:.5;
  transition:transform .15s var(--curva), opacity .15s ease}
.col-det summary:hover .svg-ic{opacity:1}
.col-det[open] summary .svg-ic{transform:rotate(180deg)}
.sep{color:var(--ink3);opacity:.6}
.col-cifras{margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;
  font-size:12px;color:var(--ink3)}
.col-cifras b{color:var(--ink2);font-variant-numeric:tabular-nums;font-weight:500}
.col-ppto{margin-top:8px;padding-top:8px;font-size:12px;color:var(--ink3);
  box-shadow:inset 0 1px 0 var(--filo-suave)}
.col-ppto .l{display:flex;justify-content:space-between;padding:2px 0}
.col-ppto .l b{color:var(--ink2);font-variant-numeric:tabular-nums;font-weight:500}
.col-ppto .l-total{margin-top:4px;padding-top:4px;box-shadow:inset 0 1px 0 var(--filo-suave);color:var(--ink2)}
.col-ppto .l-total b{color:var(--ink)}
.col-body{padding:4px 8px 8px;display:flex;flex-direction:column;gap:4px;min-height:40px}
.col-pie{padding:0 8px 12px;display:flex;gap:8px}

/* --------------------------------------------------------------- tarjeta */
/* El unico color de la tarjeta es la barra: verde tecnico, ambar legal. */
.card{
  --acento:var(--filo);
  background:var(--capa-2);border-radius:var(--radio-s);
  padding:8px 10px 8px 14px;cursor:grab;
  box-shadow:var(--anillo-suave);
  transition:background-color .15s ease, transform .15s var(--curva), opacity .15s ease;
  position:relative;
}
.card::before{content:"";position:absolute;left:4px;top:8px;bottom:8px;width:3px;
  border-radius:2px;background:var(--acento)}
.card:hover{background:var(--capa-3)}
.card:active{cursor:grabbing;transform:scale(.995)}
.card.cat-tecnico{--acento:var(--verde)}
.card.cat-legal{--acento:var(--ambar)}
.card.cat-tecnico .m-cat{color:var(--verde)}
.card.cat-legal .m-cat{color:var(--ambar)}
.card.arrastrando{opacity:.3}
.card.off{opacity:.45;background:transparent}
.card.off .c-nom{text-decoration:line-through}
/* Desactivado por licencia: la plaza sigue ahi, por eso no se tacha ni se
   difumina tanto como una desactivacion de simulacion. */
.card.off.lic{opacity:.65}
.card.off.lic .c-nom{text-decoration:none;font-style:italic}
.c-lic{font-size:11px;color:var(--cian);margin-bottom:4px;padding-right:72px}
/* Jefe que dirige el equipo desde otra coordinacion: va en la cabecera de la
   columna, no como tarjeta, para que no se cuente dos veces. */
.jef-ext{display:flex;flex-direction:column;gap:2px;margin:4px 0 0}
.jef-ext .jx{font-size:12px;color:var(--ink2);cursor:default}
.jef-ext .jx b{font-size:11px;color:var(--ink3);font-weight:500;margin-right:4px}
.jef-ext .jx i{font-style:normal;color:var(--ink3)}
.c-top{display:flex;align-items:baseline;gap:8px}
.c-nom{font-weight:500;font-size:12px;line-height:1.3;flex:1;color:var(--ink)}
.card.rol-jefe .c-nom{font-weight:600}
.c-jefe{font-size:11px;color:var(--ink3);font-weight:500;white-space:nowrap}
.c-meta{margin-top:2px;font-size:11px;line-height:1.4;color:var(--ink3);
  display:flex;flex-wrap:wrap;gap:0 6px}
.c-meta b{color:var(--ink2);font-weight:500}
.c-linea{margin-top:4px;display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.chip{font-size:11px;border-radius:4px;padding:0 6px;font-weight:500;white-space:nowrap;
  line-height:1.6;background:rgba(var(--rgb-luz),.07);color:var(--ink2)}
.chip-eti{font-weight:500}
.chip-eti.mini{font-size:11px;padding:0 6px}
.c-reparto{margin-top:2px;display:flex;gap:0 8px;flex-wrap:wrap;font-size:11px;color:var(--ink3)}
.c-reparto b{color:var(--ink2);font-variant-numeric:tabular-nums;font-weight:500}
.aportes{margin-top:8px;padding-top:8px;box-shadow:inset 0 1px 0 var(--filo-suave)}
.aportes-tit{font-size:11px;color:var(--ink3);margin-bottom:4px}
.aporte{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink2);
  border-radius:var(--radio-xs);padding:4px 8px;
  margin-bottom:2px;cursor:pointer;transition:background-color .15s ease}
.aporte:hover{background:var(--hover)}
.ap-nom{font-weight:500;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ap-org{font-size:11px;color:var(--ink3);white-space:nowrap}
.aporte b{margin-left:auto;color:var(--ink2);font-variant-numeric:tabular-nums;font-weight:500}
.rep-fila{display:grid;grid-template-columns:1fr 112px 32px;gap:12px;margin-bottom:8px;align-items:center}
.rep-resto{font-size:12px;color:var(--ink2);margin-top:8px}
.rep-resto b{color:var(--ink)}
.rep-resto.mal{color:var(--rojo)}
.pto{display:inline-block;width:8px;height:8px;border-radius:50%}
.color-op{display:flex;gap:8px;flex-wrap:wrap;padding-top:8px}
.color-op label{display:flex;align-items:center;gap:8px;border-radius:var(--radio-xs);
  padding:6px 12px;cursor:pointer;font-size:12px;box-shadow:var(--anillo-suave);
  transition:background-color .15s ease, box-shadow .15s ease}
.color-op label:hover{background:var(--hover)}
.color-op input{width:auto}
.color-op label:has(input:checked){box-shadow:inset 0 0 0 1px var(--select)}
.c-pie{margin-top:4px;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink3)}
.c-sueldo{font-weight:500;color:var(--ink2);font-variant-numeric:tabular-nums}
.c-fin{margin-left:auto}
.c-fin.pronto{color:var(--ambar)}
.c-acc{position:absolute;top:6px;right:6px;display:none;gap:2px;
  background:inherit;border-radius:var(--radio-xs);padding-left:8px}
.card:hover .c-acc{display:flex}
.ic{background:var(--control);border-radius:var(--radio-xs);width:22px;height:22px;
  display:flex;align-items:center;justify-content:center;font-size:12px;padding:0;
  color:var(--ink2);transition:background-color .15s ease, color .15s ease, transform .05s ease}
.ic .svg-ic{width:13px;height:13px}
.c-acc .ic{background:transparent}
.ic:hover,.c-acc .ic:hover{background:rgba(var(--rgb-luz),.12);color:var(--ink)}
.ic:active{transform:scale(.94)}
.vacio{font-size:12px;color:var(--ink3);text-align:center;padding:16px 4px}

/* ------------------------------------------------------------ organigrama */
.org-lienzo{overflow-x:auto;overflow-y:hidden;padding:16px 10px 20px}
.org, .org ul{list-style:none;margin:0;padding:0}
.org{display:flex;justify-content:center;min-width:max-content}
.org ul{display:flex;justify-content:center;padding-top:20px;position:relative}
.org li{position:relative;padding:20px 8px 0;display:flex;flex-direction:column;align-items:center}
/* Los conectores del arbol se trazan con lineas: aqui la linea es el dibujo. */
.org li::before,.org li::after{content:"";position:absolute;top:0;right:50%;
  border-top:1px solid var(--filo);width:50%;height:20px}
.org li::after{right:auto;left:50%;border-left:1px solid var(--filo)}
.org li:only-child{padding-top:0}
.org li:only-child::before,.org li:only-child::after{display:none}
.org li:first-child::before,.org li:last-child::after{border:0}
.org li:last-child::before{border-right:1px solid var(--filo);border-radius:0 6px 0 0}
.org li:first-child::after{border-radius:6px 0 0 0}
.org ul::before{content:"";position:absolute;top:0;left:50%;
  border-left:1px solid var(--filo);width:0;height:20px}
.org > li{padding-top:0}
.org > li::before,.org > li::after{display:none}

.org-nodo{border-radius:var(--radio);background:var(--capa-1);
  box-shadow:var(--anillo-suave);min-width:170px;max-width:232px;
  position:relative;text-align:left;
  transition:background-color .15s ease, transform .2s var(--curva)}
.org-nodo:hover{background:var(--capa-2);transform:translateY(-1px)}
.org-nodo.raiz{background:var(--ink);color:var(--ink-inv);min-width:212px;
  box-shadow:var(--sombra)}
.org-nodo.raiz:hover{background:var(--ink-max)}
.org-nodo.area{background:var(--capa-2)}
.org-nodo.coord{background:var(--capa-1);min-width:188px;max-width:250px}
.org-cab{display:flex;align-items:center;gap:6px;padding:10px 12px 8px}
.org-nom{font-weight:500;font-size:12.5px;line-height:1.25;flex:1;color:var(--ink)}
.org-nodo.raiz .org-nom{font-size:13.5px;color:var(--ink-inv);font-weight:600}
.org-cifras{display:flex;flex-wrap:wrap;gap:4px 12px;padding:0 12px 12px;font-size:11px;
  color:var(--ink3)}
.org-nodo.raiz .org-cifras{color:rgba(var(--rgb-inv),.6)}
.org-cifras b{color:var(--ink2);font-variant-numeric:tabular-nums;font-weight:500}
.org-cifras .org-prod{flex:0 0 100%}
.org-nodo.raiz .org-cifras .org-prod{flex:0 0 auto}
.org-nodo.raiz .org-cifras b{color:var(--ink-inv)}
.org-acc{display:flex;gap:2px}
.org-acc .ic{width:20px;height:20px}
.org-acc .ic .svg-ic{width:12px;height:12px}
.org-nodo.raiz .org-acc .ic{background:rgba(var(--rgb-inv),.1);color:rgba(var(--rgb-inv),.7)}
.org-nodo.raiz .org-acc .ic:hover{background:rgba(var(--rgb-inv),.2);color:var(--ink-inv)}
.org-gente{padding:8px;display:flex;flex-direction:column;gap:2px;
  box-shadow:inset 0 1px 0 var(--filo-suave);margin:0 2px}
.org-p{display:flex;align-items:center;gap:8px;font-size:11px;line-height:1.4;
  padding:2px 6px;border-radius:var(--radio-xs);cursor:pointer;
  transition:background-color .15s ease}
.org-p:hover{background:var(--hover)}
.org-p.off{opacity:.4;text-decoration:line-through}
.org-p .pto{flex:0 0 auto}
.org-p .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;
  font-weight:500;color:var(--ink)}
.org-p .mo{font-size:11px;color:var(--ink3);white-space:nowrap}
.org-p .pr{font-variant-numeric:tabular-nums;color:var(--ink2);white-space:nowrap}
.org-vacio{padding:8px 12px;font-size:11px;color:var(--ink3)}
/* Personal en dos columnas: legales a la izquierda, técnicos a la derecha. */
.org-nodo.coord.dos{min-width:380px;max-width:460px}
.org-cols{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
.org-col{display:flex;flex-direction:column;gap:2px;min-width:0}
.org-col + .org-col{box-shadow:inset 1px 0 0 var(--filo-suave);padding-left:8px}
.org-col-tit{font-size:10.5px;font-weight:500;color:var(--ink3);padding:4px 6px 2px;
  letter-spacing:.03em;text-transform:uppercase}
.org-col-tit b{color:var(--ink2);font-variant-numeric:tabular-nums;font-weight:500}
.org-col .org-vacio{padding:2px 6px}
/* Las coordinaciones se arrastran hasta otra unidad o junto a otra coordinación. */
.org-nodo.coord[draggable="true"]{cursor:grab}
.org-nodo.arrastrando{opacity:.35}
.org-nodo.drop{box-shadow:inset 0 0 0 2px var(--select)}
.org-nodo.antes{box-shadow:-4px 0 0 var(--select), var(--anillo-suave)}
.org-nodo.despues{box-shadow:4px 0 0 var(--select), var(--anillo-suave)}
.btn-out.on{background:var(--hover);color:var(--ink);box-shadow:inset 0 0 0 1px var(--select)}
/* Filtro de unidades del organigrama */
#menuUnidades .menu-lista{left:0;right:auto;min-width:260px;padding:6px}
#menuUnidades.fijo .menu-lista{animation:none}
#menuUnidades .lista-chk{max-height:320px}
#menuUnidades .lista-chk label{padding:6px 10px;font-size:12.5px}
.org-filtro-acc{display:flex;gap:4px;margin-bottom:4px}
.org-filtro-acc button{width:auto;flex:1;text-align:center;font-size:12px;padding:6px 8px}
.org-mas{font-size:11px;color:var(--select);padding:2px 4px;cursor:pointer;font-weight:500}
.org-mas:hover{text-decoration:underline}

/* ---------------------------------------------------------------- paneles */
.panel{background:var(--capa-1);border-radius:var(--radio);
  box-shadow:var(--anillo-suave);margin-bottom:24px;overflow:hidden}
.panel-cab{padding:12px 16px;font-weight:600;color:var(--ink);font-size:13px;
  display:flex;align-items:center;gap:12px;box-shadow:inset 0 -1px 0 var(--filo-suave)}
.panel-cab .der{margin-left:auto;display:flex;gap:6px}
.tabla-wrap{overflow-x:auto;overflow-y:hidden}

.barra-h,.tabla-wrap,.kpis,.m-body,.lista-chk,main{
  scrollbar-width:thin;scrollbar-color:rgba(var(--rgb-luz),.18) transparent;
}
.barra-h::-webkit-scrollbar,.tabla-wrap::-webkit-scrollbar,.kpis::-webkit-scrollbar,
.m-body::-webkit-scrollbar,.lista-chk::-webkit-scrollbar,
main::-webkit-scrollbar{height:12px;width:12px}
.barra-h::-webkit-scrollbar-track,.tabla-wrap::-webkit-scrollbar-track,
.kpis::-webkit-scrollbar-track,.m-body::-webkit-scrollbar-track,
.lista-chk::-webkit-scrollbar-track,main::-webkit-scrollbar-track{background:transparent}
.barra-h::-webkit-scrollbar-thumb,.tabla-wrap::-webkit-scrollbar-thumb,
.kpis::-webkit-scrollbar-thumb,.m-body::-webkit-scrollbar-thumb,
.lista-chk::-webkit-scrollbar-thumb,main::-webkit-scrollbar-thumb{
  background:rgba(var(--rgb-luz),.18);border-radius:20px;
  border:3px solid transparent;background-clip:content-box;
  transition:background-color .15s ease}
.barra-h::-webkit-scrollbar-thumb:hover,.tabla-wrap::-webkit-scrollbar-thumb:hover,
.kpis::-webkit-scrollbar-thumb:hover,.m-body::-webkit-scrollbar-thumb:hover,
.lista-chk::-webkit-scrollbar-thumb:hover,main::-webkit-scrollbar-thumb:hover{
  background:rgba(var(--rgb-luz),.3);background-clip:content-box}

table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 16px;text-align:left;white-space:nowrap}
th{background:transparent;font-weight:500;color:var(--ink3);font-size:12px;
  box-shadow:inset 0 -1px 0 var(--filo-suave)}
td{color:var(--ink2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr td{transition:background-color .15s ease;box-shadow:inset 0 -1px 0 var(--filo-suave)}
tbody tr:hover td{background:var(--hover)}
tbody tr td:first-child{color:var(--ink)}
tr.total td{font-weight:600;background:rgba(var(--rgb-luz),.06);color:var(--ink)}
tr.total:hover td{background:rgba(var(--rgb-luz),.06)}
tr.off td{opacity:.4}

/* --------------------------------------------------------------- filtros */
.barra{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.campo{display:flex;flex-direction:column;gap:4px}
/* La etiqueta del campo va en gris; las casillas que vengan despues
   conservan su color normal. */
.campo > label:first-child{font-size:12px;color:var(--ink3)}
.campo > label{display:flex;align-items:center;gap:8px}
input[type=text],input[type=number],input[type=date],select,textarea{
  border-radius:var(--radio-s);padding:8px 12px;background:rgba(var(--rgb-luz),.05);
  color:var(--ink);min-width:0;width:100%;box-shadow:var(--anillo-suave);
  transition:box-shadow .15s ease, background-color .15s ease;
}
input::placeholder{color:var(--ink3)}
/* La lista desplegable de los <select> la pinta el sistema: sin esto, en
   Windows sale con fondo blanco y hereda la letra blanca, y no se lee nada. */
select{color-scheme:var(--esquema)}
select option{background:var(--opcion);color:var(--ink);padding:6px 10px}
select option:checked,select option:hover{background:var(--opcion-on);color:var(--ink)}
select option:disabled{color:var(--ink3)}
input:hover,select:hover,textarea:hover{background:var(--hover)}
input:focus,select:focus,textarea:focus{outline:0;background:var(--hover);
  box-shadow:inset 0 0 0 1px var(--select)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}

/* ----------------------------------------------------------------- modal */
.velo{position:fixed;inset:0;background:var(--velo-modal);display:none;
  align-items:flex-start;justify-content:center;padding:48px 16px;z-index:50;overflow:auto}
.velo.on{display:flex;animation:aparece .18s ease both}
.modal{background:var(--sup-modal);border-radius:12px;width:100%;max-width:760px;
  box-shadow:var(--sombra-alta), var(--anillo);overflow:hidden}
.velo.on .modal{animation:entraModal .22s var(--curva) both}
@keyframes entraModal{from{opacity:0;transform:translateY(-10px) scale(.99)}to{opacity:1;transform:none}}
.modal.chico{max-width:480px}
.m-cab{padding:16px 20px;display:flex;align-items:center;
  box-shadow:inset 0 -1px 0 var(--filo-suave)}
.m-cab h3{margin:0;font-size:15px;font-weight:600;color:var(--ink);letter-spacing:-.1px}
.m-cab .x{margin-left:auto;background:transparent;color:var(--ink3);
  width:28px;height:28px;display:flex;align-items:center;justify-content:center;
  padding:0;border-radius:var(--radio-xs);
  transition:background-color .15s ease, color .15s ease}
.m-cab .x:hover{background:var(--hover);color:var(--ink)}
.m-body{padding:20px;max-height:64vh;overflow:auto}
.m-pie{padding:12px 20px;display:flex;gap:8px;justify-content:flex-end;
  box-shadow:inset 0 1px 0 var(--filo-suave)}
.aviso{background:rgba(255,214,10,.09);color:var(--ink2);
  padding:12px;border-radius:var(--radio-s);font-size:12px;margin-bottom:16px;
  line-height:1.5;box-shadow:inset 0 0 0 1px rgba(255,214,10,.2)}
.aviso b{color:var(--amarillo)}

/* --------------------------------------------------------------- buscador */
#buscador{position:fixed;top:10px;right:16px;z-index:60;display:none;align-items:center;
  gap:8px;background:var(--sup-modal);
  border-radius:var(--radio);padding:8px 12px;
  box-shadow:var(--sombra-alta), var(--anillo)}
#buscador.on{display:flex;animation:entraBuscador .2s var(--curva) both}
@keyframes entraBuscador{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.b-lupa{color:var(--ink3);display:flex}
#buscador input{width:240px;padding:6px 12px}
#b-cuenta{font-size:12px;color:var(--ink3);min-width:76px;text-align:center;
  font-variant-numeric:tabular-nums;white-space:nowrap}
#b-cuenta.sin{color:var(--rojo)}

.resaltado{border-radius:var(--radio-xs);background-color:rgba(255,214,10,.14) !important;
  box-shadow:inset 0 0 0 1px rgba(255,214,10,.4)}
tr.resaltado{box-shadow:none}
tr.resaltado td{background-color:rgba(255,214,10,.14) !important;color:var(--ink)}
.resaltado-actual{box-shadow:inset 0 0 0 1px var(--amarillo), 0 0 0 3px rgba(255,214,10,.22)}
tr.resaltado-actual td{background-color:rgba(255,214,10,.24) !important}

/* ------------------------------------------------------------------ toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--sup-modal);color:var(--ink);
  padding:12px 20px;border-radius:var(--radio);font-size:13px;
  box-shadow:var(--sombra-alta), var(--anillo);z-index:99;max-width:70vw;
  transition:transform .22s var(--curva), opacity .18s ease;opacity:0}
#toast.on{transform:translateX(-50%) translateY(0);opacity:1}
#toast.err{box-shadow:var(--sombra-alta), inset 0 0 0 1px rgba(255,122,122,.4);
  color:var(--rojo)}

/* ------------------------------------------------------------- estructura */
.est-fila{display:flex;align-items:center;gap:12px;padding:12px 16px;
  box-shadow:inset 0 -1px 0 var(--filo-suave);transition:background-color .15s ease}
.est-fila:hover{background:var(--hover)}
.est-fila .nom{font-weight:500;color:var(--ink)}
.est-fila .meta{font-size:12px;color:var(--ink3);margin-top:2px}
.est-fila .meta b{color:var(--ink2);font-weight:500}
.est-fila .acc{margin-left:auto;display:flex;gap:8px}
.sangria{padding-left:32px}
.pill{font-size:12px;color:var(--ink3)}
.lista-chk{border-radius:var(--radio-s);max-height:250px;overflow:auto;
  background:rgba(var(--rgb-luz),.04);box-shadow:var(--anillo-suave);padding:4px}
.lista-chk label{display:flex;gap:12px;align-items:center;padding:8px 12px;
  font-size:13px;border-radius:var(--radio-xs);transition:background-color .15s ease}
.lista-chk label:hover{background:var(--hover)}
.lista-chk input{width:auto}
.nada{padding:40px 32px;text-align:center;color:var(--ink3);font-size:13px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.01ms !important}
}
</style>
</head>

<script>
/* =====================================================================
   0. PUENTE CON EL NAVEGADOR (versión GitHub Pages)
   ---------------------------------------------------------------------
   Todo el archivo que sigue es el mismo del .exe y no sabe dónde corre:
   solo habla con window.pywebview.api. Aquí ese objeto se arma en el
   propio navegador, sin servidor: la base vive en localStorage mientras
   se trabaja, y entra y sale como archivo con "Importar base" y
   "Exportar base". Nada de lo que se carga viaja a ningún lado.
   ===================================================================== */
var WEBP = {
  clave: "gestorPersonalWeb",
  nombre: "",          // nombre del archivo de la base que se importó
  exportado: null,     // JSON de la última versión importada o exportada
  sinBase: false,      // true si al abrir no había nada guardado
  sucio: false         // hay cambios que no están en ningún archivo
};

(function () {
  const LIB = {
    xlsx:  ["https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js", "XLSX"],
    jspdf: ["https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js", "jspdf"]
  };
  const cargadas = {};

  /* Las librerías se bajan recién cuando se usan: para mover gente no hace
     falta ninguna, y así la página abre rápido y funciona sin internet. */
  function lib(n) {
    const [url, global] = LIB[n];
    if (window[global]) return Promise.resolve(window[global]);
    if (!cargadas[n]) {
      cargadas[n] = new Promise((ok, mal) => {
        const s = document.createElement("script");
        s.src = url;
        s.onload = () => ok(window[global]);
        s.onerror = () => { delete cargadas[n]; mal(new Error("no se pudo descargar " + n + " (¿sin internet?)")); };
        document.head.appendChild(s);
      });
    }
    return cargadas[n];
  }

  function leerLocal() {
    try { return JSON.parse(localStorage.getItem(WEBP.clave)) || null; } catch (e) { return null; }
  }

  function escribirLocal(datos) {
    localStorage.setItem(WEBP.clave, JSON.stringify(
      { datos, nombre: WEBP.nombre, exportado: WEBP.exportado }));
  }

  /* Descarga un archivo hecho en memoria; el navegador lo deja en Descargas. */
  function descargar(contenido, nombre, tipo) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(contenido instanceof Blob ? contenido : new Blob([contenido], { type: tipo }));
    a.download = nombre;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }

  /* Abre el selector de archivos. Si se cancela, devuelve null. */
  function elegirArchivo(acepta) {
    return new Promise(ok => {
      const inp = document.createElement("input");
      inp.type = "file";
      inp.accept = acepta;
      inp.onchange = () => ok(inp.files && inp.files[0] ? inp.files[0] : null);
      inp.oncancel = () => ok(null);
      inp.click();
    });
  }

  WEBP.descargar = descargar;
  WEBP.elegirArchivo = elegirArchivo;
  WEBP.marcar = function (datos) {
    WEBP.sucio = WEBP.exportado !== null && JSON.stringify(datos) !== WEBP.exportado;
    if (WEBP.alCambiar) WEBP.alCambiar();
  };

  /* ---------------------------------------------------------------- excel */

  const fino = { style: "thin", color: { rgb: "BFBFBF" } };
  const BORDE = { left: fino, right: fino, top: fino, bottom: fino };

  async function escribirExcel(nombre, hojas) {
    const X = await lib("xlsx");
    const wb = X.utils.book_new();
    hojas.forEach(hoja => {
      const columnas = hoja.columnas || [];
      const filas = hoja.filas || [];
      const ws = X.utils.aoa_to_sheet([columnas].concat(filas));
      columnas.forEach((_, c) => {
        const cel = ws[X.utils.encode_cell({ r: 0, c })];
        if (cel) cel.s = {
          fill: { fgColor: { rgb: "1F3864" } }, font: { color: { rgb: "FFFFFF" }, bold: true, sz: 10 },
          border: BORDE, alignment: { horizontal: "center", vertical: "center", wrapText: true }
        };
      });
      filas.forEach((fila, i) => {
        const total = fila && fila.length && String(fila[0]).toUpperCase().startsWith("TOTAL");
        columnas.forEach((_, c) => {
          const ref = X.utils.encode_cell({ r: i + 1, c });
          if (!ws[ref]) ws[ref] = { t: "s", v: "" };
          const cel = ws[ref];
          cel.s = { border: BORDE, font: { sz: 10, bold: !!total } };
          if (total) cel.s.fill = { fgColor: { rgb: "DCE6F1" } };
          if (cel.t === "n") {
            cel.z = Number.isInteger(cel.v) ? "#,##0" : "#,##0.00";
            cel.s.alignment = { horizontal: "right" };
          }
        });
      });
      ws["!cols"] = columnas.map((n, c) => {
        let ancho = String(n).length;
        filas.forEach(f => { if (c < f.length && f[c] != null) ancho = Math.max(ancho, String(f[c]).length); });
        return { wch: Math.min(Math.max(ancho + 3, 10), 42) };
      });
      if (filas.length)
        ws["!autofilter"] = { ref: "A1:" + X.utils.encode_cell({ r: filas.length, c: columnas.length - 1 }) };
      X.utils.book_append_sheet(wb, ws, String(hoja.nombre || "Hoja").slice(0, 31));
    });
    X.writeFile(wb, nombre, { compression: true });
  }

  /* Mismo criterio que _leer_excel de app.py: solo las hojas "Personal..." e
     "Historial", fechas como AAAA-MM-DD, sí/no como SI/NO, sin filas vacías. */
  async function leerExcel(archivo) {
    const X = await lib("xlsx");
    const wb = X.read(await archivo.arrayBuffer(), { type: "array", cellDates: true });
    const dos = n => String(n).padStart(2, "0");
    const hojas = {};
    wb.SheetNames.forEach(nombre => {
      const t = nombre.trim().toLowerCase();
      if (!(t.startsWith("personal") || t === "historial")) return;
      const crudas = X.utils.sheet_to_json(wb.Sheets[nombre], { header: 1, raw: true, defval: "" });
      const filas = [];
      crudas.forEach(fila => {
        const celdas = (fila || []).map(v => {
          if (v === null || v === undefined) return "";
          if (typeof v === "boolean") return v ? "SI" : "NO";
          if (v instanceof Date) {
            if (v.getFullYear() < 1900) return "";   // una hora sola, sin fecha
            return v.getFullYear() + "-" + dos(v.getMonth() + 1) + "-" + dos(v.getDate());
          }
          return v;
        });
        if (celdas.some(c => String(c).trim())) filas.push(celdas);
      });
      if (filas.length) hojas[nombre] = filas;
    });
    return hojas;
  }

  /* ---------------------------------------------------------- organigrama */

  /* Traducción de _dibujar_organigrama de app.py a jsPDF. Las medidas son las
     mismas; solo cambia que aquí la y crece hacia abajo. */
  async function dibujarOrganigrama(nombre, datos) {
    const { jsPDF } = await lib("jspdf");
    const SEP_X = 14, SEP_Y = 30, MARGEN = 26, PAD = 6;
    const ANCHO = { raiz: 190, area: 150, unidad: 150, coord: 168 };
    const ANCHO_DOS = 300, SEP_COL = 8;   // coordinación con legales y técnicos en dos columnas
    const F_TIT = 9.5, F_CIF = 7.2, F_GEN = 6.6;
    const ALT_TIT = 12, ALT_CIF = 9, ALT_GEN = 8.4;
    const COLOR = {
      raiz:   ["#1F3864", "#FFFFFF", "#1F3864"],
      area:   ["#E2EAF7", "#1F3864", "#C4D5EF"],
      unidad: ["#FFFFFF", "#1B2230", "#DDE3EC"],
      coord:  ["#FBFCFE", "#1B2230", "#DDE3EC"]
    };
    const LINEA = "#C3CCDB", GRIS = "#5A6577";

    // Helvetica no tiene la estrella: se sustituye por un asterisco
    const limpio = s => String(s == null ? "" : s).replace(/★/g, "*").replace(/→/g, "->");

    // Para medir se usa un documento aparte, a tamaño real.
    const m = new jsPDF({ unit: "pt" });
    const ancho = (txt, estilo, tam) => { m.setFont("helvetica", estilo); m.setFontSize(tam); return m.getTextWidth(txt); };
    function recortar(txt, tam, util) {
      if (ancho(txt, "normal", tam) <= util) return txt;
      let corto = txt;
      while (corto && ancho(corto + "...", "normal", tam) > util) corto = corto.slice(0, -1);
      return corto.trimEnd() + "...";
    }

    // Renglones del personal: cada uno, una lista de [dx, texto, negrita, activo].
    // Con "columnas", legales (izq) y técnicos (der) lado a lado; sin "col" va
    // arriba a todo lo ancho y "fin", abajo.
    function renglones(n, util) {
      const gente = n.gente || [];
      const celda = (g, dx, w) => [dx, recortar(limpio(g.txt), F_GEN, w), !!g.jefe, g.activo !== false];
      if (!n.columnas) return gente.map(g => [celda(g, 0, util)]);
      const media = (util - SEP_COL) / 2;
      const izq = gente.filter(g => g.col === "izq"), der = gente.filter(g => g.col === "der");
      const filas = gente.filter(g => !g.col).map(g => [celda(g, 0, util)]);
      filas.push([[0, limpio(n.columnas[0]), true, false], [media + SEP_COL, limpio(n.columnas[1]), true, false]]);
      for (let i = 0; i < Math.max(izq.length, der.length); i++) {
        const fila = [];
        if (i < izq.length) fila.push(celda(izq[i], 0, media));
        if (i < der.length) fila.push(celda(der[i], media + SEP_COL, media));
        filas.push(fila);
      }
      const fin = gente.filter(g => g.col === "fin");
      if (fin.length && n.columnas.length > 2) filas.push([[0, limpio(n.columnas[2]), true, false]]);
      fin.forEach(g => filas.push([celda(g, 0, util)]));
      return filas;
    }

    // --- 1) medir cada nodo y su rama ---
    function medir(n) {
      const w = n.columnas ? ANCHO_DOS : (ANCHO[n.tipo || "unidad"] || 150);
      const util = w - 2 * PAD;
      m.setFont("helvetica", "bold"); m.setFontSize(F_TIT);
      n._lin_tit = m.splitTextToSize(limpio(n.nombre), util);
      n._lin_cif = (n.cifras || []).map(([a, b]) => limpio(a) + ": " + limpio(b));
      n._filas = renglones(n, util);
      n._w = w;
      n._h = PAD + n._lin_tit.length * ALT_TIT + 2 + n._lin_cif.length * ALT_CIF +
             (n._filas.length ? 4 + n._filas.length * ALT_GEN : 0) + PAD;
      const hijos = n.hijos || [];
      hijos.forEach(medir);
      if (hijos.length) {
        n._wr = Math.max(n._w, hijos.reduce((s, h) => s + h._wr, 0) + SEP_X * (hijos.length - 1));
        n._hr = n._h + SEP_Y + Math.max(...hijos.map(h => h._hr));
      } else {
        n._wr = n._w; n._hr = n._h;
      }
    }

    // --- 2) colocar (y crece hacia abajo) ---
    function colocar(n, x, y) {
      n._x = x + (n._wr - n._w) / 2;
      n._y = y;
      let cx = x;
      const hy = y + n._h + SEP_Y;
      (n.hijos || []).forEach(h => { colocar(h, cx, hy); cx += h._wr + SEP_X; });
    }

    const raiz = datos.raiz || { nombre: "(vacío)", tipo: "raiz" };
    medir(raiz);
    colocar(raiz, MARGEN, 0);

    const cab = 30;
    const anchoPag = raiz._wr + 2 * MARGEN;
    const altoPag = raiz._hr + 2 * MARGEN + cab;
    const k = Math.min(1, 14000 / anchoPag, 14000 / altoPag);

    const doc = new jsPDF({ unit: "pt", format: [anchoPag * k, altoPag * k],
                            orientation: anchoPag >= altoPag ? "landscape" : "portrait" });
    doc.setProperties({ title: limpio(datos.titulo || "Organigrama") });

    // Todo pasa por aquí para aplicar la escala de una sola vez.
    const texto = (t, x, y, estilo, tam, color) => {
      doc.setFont("helvetica", estilo); doc.setFontSize(tam * k); doc.setTextColor(color);
      doc.text(t, x * k, y * k);
    };
    const linea = (x1, y1, x2, y2, color, grosor) => {
      doc.setDrawColor(color); doc.setLineWidth(grosor * k);
      doc.line(x1 * k, y1 * k, x2 * k, y2 * k);
    };

    texto(limpio(datos.titulo || "Organigrama"), MARGEN, MARGEN + 12, "bold", 14, "#1F3864");
    texto(limpio(datos.fecha || ""), MARGEN, MARGEN + 23, "normal", 8, GRIS);

    const base = MARGEN + cab;          // los nodos cuelgan de aquí

    // --- 3) conectores ---
    function lineas(n) {
      const hijos = n.hijos || [];
      if (!hijos.length) return;
      const pie = base + n._y + n._h;
      const medio = pie + SEP_Y / 2;
      const cx = n._x + n._w / 2;
      linea(cx, pie, cx, medio, LINEA, 0.7);
      const xs = hijos.map(h => h._x + h._w / 2);
      if (xs.length > 1) linea(Math.min(...xs), medio, Math.max(...xs), medio, LINEA, 0.7);
      hijos.forEach((h, i) => { linea(xs[i], medio, xs[i], base + h._y, LINEA, 0.7); lineas(h); });
    }

    // --- 4) cajas ---
    function caja(n) {
      const tipo = n.tipo || "unidad";
      const [fondo, tinta, borde] = COLOR[tipo] || COLOR.unidad;
      const x = n._x, y = base + n._y, w = n._w, h = n._h;
      doc.setFillColor(fondo); doc.setDrawColor(borde); doc.setLineWidth(0.9 * k);
      doc.roundedRect(x * k, y * k, w * k, h * k, 5 * k, 5 * k, "FD");

      let cy = y + PAD;
      n._lin_tit.forEach(ln => { cy += ALT_TIT - 2; texto(ln, x + PAD, cy, "bold", F_TIT, tinta); cy += 2; });
      const gris = tipo === "raiz" ? "#FFFFFF" : GRIS;
      n._lin_cif.forEach(ln => { cy += ALT_CIF; texto(ln, x + PAD, cy, "normal", F_CIF, gris); });

      if (n._filas.length) {
        cy += 4;
        linea(x + PAD, cy - 3, x + w - PAD, cy - 3, borde, 0.5);
        n._filas.forEach(fila => {
          cy += ALT_GEN;
          fila.forEach(([dx, ln, negrita, activo]) =>
            texto(ln, x + PAD + dx, cy, negrita ? "bold" : "normal", F_GEN, activo ? "#1B2230" : GRIS));
        });
      }
      (n.hijos || []).forEach(caja);
    }

    lineas(raiz);
    caja(raiz);
    doc.save(nombre);
  }

  /* ------------------------------------------------------------ el puente */

  const enDescargas = n => n + " (carpeta Descargas)";
  const falla = e => ({ ok: false, error: String(e && e.message ? e.message : e) });

  window.pywebview = {
    api: {
      async cargar() {
        const g = leerLocal();
        if (g && g.datos) {
          WEBP.nombre = g.nombre || "";
          WEBP.exportado = typeof g.exportado === "string" ? g.exportado : null;
          WEBP.marcar(g.datos);
          return { ok: true, datos: g.datos, ruta: WEBP.nombre || "base sin nombre" };
        }
        WEBP.sinBase = true;
        return { ok: true, datos: null, ruta: "sin base" };
      },

      async guardar(datos) {
        // La base vacía con que arranca la página no cuenta como cambio.
        if (WEBP.exportado === null) WEBP.exportado = JSON.stringify(datos);
        WEBP.marcar(datos);
        try { escribirLocal(datos); return { ok: true }; }
        catch (e) { return falla("el navegador no dejó guardar (" + (e.message || e) + ")"); }
      },

      async exportar_respaldo(datos, sugerido) {
        WEBP.descargar(JSON.stringify(datos, null, 1), sugerido, "application/json");
        return { ok: true, ruta: enDescargas(sugerido) };
      },

      async importar_respaldo() {
        const f = await WEBP.elegirArchivo(".json,application/json");
        if (!f) return { ok: false, cancelado: true };
        try {
          const datos = JSON.parse(await f.text());
          if (!datos || typeof datos !== "object" || !Array.isArray(datos.personas))
            return { ok: false, error: "el archivo no parece una base del Gestor de Personal" };
          return { ok: true, datos, ruta: f.name };
        } catch (e) { return falla("no es un JSON válido"); }
      },

      async exportar_excel(payload, sugerido) {
        try { await escribirExcel(sugerido, payload.hojas || []); return { ok: true, ruta: enDescargas(sugerido) }; }
        catch (e) { return falla(e); }
      },

      async importar_excel() {
        const f = await WEBP.elegirArchivo(".xlsx,.xlsm");
        if (!f) return { ok: false, cancelado: true };
        try { return { ok: true, ruta: f.name, hojas: await leerExcel(f) }; }
        catch (e) { return falla(e); }
      },

      async exportar_organigrama(datos, sugerido) {
        try { await dibujarOrganigrama(sugerido, datos); return { ok: true, ruta: enDescargas(sugerido) }; }
        catch (e) { return falla(e); }
      }
    }
  };
})();
"use strict";

/* =====================================================================
   1. CONSTANTES Y ESTADO
   ===================================================================== */

const MODALIDADES = ["TF", "CAS", "SERVIR", "LOCADOR", "PRACTICANTE", "SECIGRISTA"];

/* Cómo se nombra cada modalidad en los desgloses de presupuesto. Todas las
   vistas se generan desde MODALIDADES, así que basta con añadirla arriba. */
const ETIQ_MOD = { "TF": "TF", "CAS": "CAS", "SERVIR": "SERVIR", "LOCADOR": "Locadores",
                   "PRACTICANTE": "Practicantes", "SECIGRISTA": "Secigristas" };
const etiqMod = m => ETIQ_MOD[m] || m;
const NIVELES_TF  = ["I", "II", "III", "IV", "V", "VI"];
const CATEGORIAS  = ["Técnico", "Legal", "Economista", "Administrativo"];
const ROLES       = ["Jefe de equipo", "Analista", "Administrativo"];

/* Por que termina un contrato. Se registra al dar de baja a la persona. */
/* Razones para que una persona no cuente en los cálculos sin haber salido del
   área. La cadena vacía es el desactivado de siempre, el que se usa para
   simular. La licencia es real: la plaza existe pero no se paga. */
const MOTIVOS_INACTIVO = ["Licencia sin goce", "Licencia con goce", "Suspensión", "Rotación temporal"];

const MOTIVOS_CESE = ["Renuncia", "Resolución contractual", "No renovación",
                      "Desistimiento", "Término de práctica", "Término de orden de servicio"];

/* Cómo se nombra cada categoría al hablar de sus productos. Todas las vistas
   generan sus columnas desde CATEGORIAS, así que basta con añadirla arriba. */
const PLURAL_CAT = { "Técnico": "técnicos", "Legal": "legales",
                     "Economista": "economistas", "Administrativo": "administrativos" };
const plural = c => PLURAL_CAT[c] || (String(c).toLowerCase() + "s");
const pluralTit = c => { const s = plural(c); return s.charAt(0).toUpperCase() + s.slice(1); };

const SECTORES_DEF = ["Minería", "Hidrocarburos", "Electricidad", "Industria",
                      "Pesquería", "Agricultura", "Residuos sólidos",
                      "Infraestructura", "Consultoras ambientales"];

/* Paleta para las etiquetas personalizadas. */
/* Pasteles adaptados al fondo oscuro: fondo apagado y letra clara. */
/* Fondo neutro translucido y letra del color: el color se lleva al texto. */
const COLORES_ETI = [
  { id: "rojo",    nombre: "Rojo",     bg: "rgba(255,122,122,.13)", fg: "var(--eti-rojo)",   bd: "transparent" },
  { id: "ambar",   nombre: "Ambar",    bg: "rgba(255,214,10,.13)",  fg: "var(--eti-ambar)",  bd: "transparent" },
  { id: "verde",   nombre: "Verde",    bg: "rgba(79,208,138,.13)",  fg: "var(--eti-verde)",  bd: "transparent" },
  { id: "azul",    nombre: "Azul",     bg: "rgba(68,131,247,.16)",  fg: "var(--eti-azul)",   bd: "transparent" },
  { id: "morado",  nombre: "Morado",   bg: "rgba(179,154,232,.14)", fg: "var(--eti-morado)", bd: "transparent" },
  { id: "gris",    nombre: "Gris",     bg: "rgba(var(--rgb-luz),.09)", fg: "var(--ink2)",    bd: "transparent" }
];
const colorEti = id => COLORES_ETI.find(c => c.id === id) || COLORES_ETI[5];

let estado = null;      // { subdirecciones, coordinaciones, personas, sectores, etiquetas }
let vista  = "kanban";
let hayApi = false;     // true si corre dentro del .exe (pywebview)
let filtros = { texto: "", modalidad: "", categoria: "", sector: "",
                coord: "", sub: "", rol: "", etiqueta: "", verInactivos: true };
let filtroAntiguos = "";

const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);

/* =====================================================================
   2. PERSISTENCIA
   ===================================================================== */

let guardadoPendiente = null;

function guardar(inmediato) {
  clearTimeout(guardadoPendiente);
  const hacer = () => {
    if (hayApi) {
      window.pywebview.api.guardar(estado).then(r => {
        if (!r.ok) toast("No se pudo guardar: " + r.error, true);
      });
    } else {
      try { localStorage.setItem("gestorPersonal", JSON.stringify(estado)); }
      catch (e) { toast("No se pudo guardar en el navegador", true); }
    }
  };
  if (inmediato) hacer(); else guardadoPendiente = setTimeout(hacer, 400);
}

function normalizar(d) {
  if (!d || typeof d !== "object") return estadoInicial();
  d.organizacion   = typeof d.organizacion === "string" && d.organizacion.trim()
                       ? d.organizacion.trim() : "DFAI";
  d.sectores       = Array.isArray(d.sectores) ? d.sectores : SECTORES_DEF.slice();
  d.subdirecciones = Array.isArray(d.subdirecciones) ? d.subdirecciones : [];
  // El padre debe existir y no puede formar un ciclo.
  d.subdirecciones.forEach(s => {
    if (s.padreId && !d.subdirecciones.some(x => x.id === s.padreId)) s.padreId = null;
  });
  d.subdirecciones.forEach(s => {
    const vistos = new Set([s.id]);
    let n = d.subdirecciones.find(x => x.id === s.padreId);
    while (n) {
      if (vistos.has(n.id)) { s.padreId = null; break; }
      vistos.add(n.id);
      n = d.subdirecciones.find(x => x.id === n.padreId);
    }
  });
  d.coordinaciones = Array.isArray(d.coordinaciones) ? d.coordinaciones : [];
  // Cómo se ve el organigrama: qué unidades se muestran y si el personal va en dos columnas.
  const org = d.org && typeof d.org === "object" ? d.org : {};
  d.org = {
    unidades: Array.isArray(org.unidades)
      ? org.unidades.filter((x, i, l) => l.indexOf(x) === i && d.subdirecciones.some(s => s.id === x))
      : [],
    dosColumnas: !!org.dosColumnas
  };
  d.etiquetas      = Array.isArray(d.etiquetas) ? d.etiquetas : [];
  d.personas       = Array.isArray(d.personas) ? d.personas : [];
  const idsEti = d.etiquetas.map(e => e.id);
  d.personas.forEach(p => {
    if (p.activo === undefined) p.activo = true;
    p.salario  = Number(p.salario)  || 0;
    p.productos = Number(p.productos) || 0;
    p.etiquetas = Array.isArray(p.etiquetas) ? p.etiquetas.filter(x => idsEti.includes(x)) : [];
    p.antiguo = !!p.antiguo;
    if (p.orden !== undefined && p.orden !== null && isFinite(Number(p.orden)))
      p.orden = Number(p.orden); else delete p.orden;
    p.motivoCese = typeof p.motivoCese === "string" ? p.motivoCese : "";
    p.fechaCese = typeof p.fechaCese === "string" ? p.fechaCese : "";
    p.observaciones = typeof p.observaciones === "string" ? p.observaciones : "";
    // Datos de legajo: no entran en ningun calculo, solo acompañan a la ficha.
    ["dni", "celular", "usuarioInaf", "nroContrato", "teletrabajo"].forEach(k => {
      p[k] = typeof p[k] === "string" ? p[k].trim() : (p[k] == null ? "" : String(p[k]).trim());
    });
    p.anioIngreso = /^\d{4}$/.test(String(p.anioIngreso || "")) ? String(p.anioIngreso) : "";
    // Dos maneras de no contar: desactivado a secas o desactivado por licencia.
    p.motivoInactivo = p.activo ? "" : (MOTIVOS_INACTIVO.includes(p.motivoInactivo) ? p.motivoInactivo : "");
    p.fechaRetorno = p.activo ? "" : (typeof p.fechaRetorno === "string" ? p.fechaRetorno : "");
    p.historial = Array.isArray(p.historial)
      ? p.historial.filter(h => h && typeof h === "object").map(h => ({
          inicio: String(h.inicio || ""), fin: String(h.fin || ""),
          motivo: String(h.motivo || ""), modalidad: String(h.modalidad || ""),
          nivelTF: String(h.nivelTF || ""), coordinacion: String(h.coordinacion || ""),
          observacion: String(h.observacion || "")
        }))
      : [];
    p.repartos = Array.isArray(p.repartos)
      ? p.repartos
          .map(r => ({ coordId: r.coordId, productos: Math.max(0, Number(r.productos) || 0) }))
          .filter(r => r.productos > 0 && d.coordinaciones.some(c => c.id === r.coordId))
      : [];
    // Un jefe puede tener a su cargo mas de un equipo, sin que su sueldo ni su
    // gente se cuenten dos veces: la coordinacion principal sigue siendo una.
    p.jefaturas = Array.isArray(p.jefaturas)
      ? p.jefaturas.filter((c, i, l) => c && c !== p.coordId && l.indexOf(c) === i &&
                                        d.coordinaciones.some(x => x.id === c))
      : [];
  });
  return d;
}

async function iniciar() {
  hayApi = !!(window.pywebview && window.pywebview.api);
  if (hayApi) {
    const r = await window.pywebview.api.cargar();
    estado = normalizar(r.datos);
    const ruta = r.ruta || "";
    document.getElementById("rutaDatos").textContent =
      "datos: " + ruta.split(/[\\/]/).pop();
    if (!r.datos) guardar(true);
  } else {
    let g = null;
    try { g = JSON.parse(localStorage.getItem("gestorPersonal")); } catch (e) {}
    estado = normalizar(g);
    document.getElementById("rutaDatos").textContent = "modo navegador";
  }
  pintarTabs();
  render();
}

/* El tema se guarda con los datos, para que el .exe lo recuerde. */
function aplicarTema() {
  const claro = estado && estado.tema === "claro";
  if (claro) document.documentElement.dataset.tema = "claro";
  else delete document.documentElement.dataset.tema;
  const b = document.getElementById("btnTema");
  if (b) {
    b.innerHTML = ico(claro ? "luna" : "sol");
    b.title = claro ? "Pasar a tema oscuro" : "Pasar a tema claro";
  }
}

function alternarTema() {
  if (!estado) return;
  estado.tema = estado.tema === "claro" ? "oscuro" : "claro";
  aplicarTema();
  guardar(true);
}

if (window.pywebview && window.pywebview.api) iniciar();
else window.addEventListener("pywebviewready", iniciar);
window.addEventListener("load", () => setTimeout(() => { if (!estado) iniciar(); }, 350));

const $  = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s)

const coordPorId = id => estado.coordinaciones.find(c => c.id === id) || null;
const subPorId   = id => estado.subdirecciones.find(s => s.id === id) || null;
const subDeCoord = id => { const c = coordPorId(id); return c ? subPorId(c.subId) : null; };
const nomCoord   = id => { const c = coordPorId(id); return c ? c.nombre : "(sin coordinación)"; };
const nomSub     = id => { const s = subDeCoord(id); return s ? s.nombre : "(sin subdirección)"; };
const nomPersona = p => (p.nombre + " " + p.apellido).trim();

/** Personal que forma parte de la composicion actual (excluye al personal antiguo). */
const vigentes = () => estado.personas.filter(p => !p.antiguo);
const antiguos = () => estado.personas.filter(p => p.antiguo);
const claveNombre = (n, a) => (n + " " + a).trim().toLowerCase().replace(/\s+/g, " ");

/** Busca a otra persona registrada con el mismo nombre y apellido. */
function buscarHomonimo(nombre, apellido, excluirId) {
  const clave = claveNombre(nombre, apellido);
  return estado.personas.find(p => p.id !== excluirId &&
    claveNombre(p.nombre, p.apellido) === clave) || null;
}

/** Reparto real de los productos de una persona, con la parte que se queda
    en su coordinación principal al frente. */
function repartoDe(p) {
  const extras = (p.repartos || [])
    .filter(r => r.coordId && r.coordId !== p.coordId && Number(r.productos) > 0)
    .map(r => ({ coordId: r.coordId, productos: Number(r.productos) }));
  const cedidos = extras.reduce((s, r) => s + r.productos, 0);
  return [{ coordId: p.coordId, productos: Math.max(0, (p.productos || 0) - cedidos) }]
    .concat(extras);
}

/** Productos que la persona aporta a una coordinación concreta. */
const productosEn = (p, coordId) =>
  (repartoDe(p).find(x => x.coordId === coordId) || {}).productos || 0;

const tieneReparto = p => (p.repartos || []).some(r =>
  r.coordId && r.coordId !== p.coordId && Number(r.productos) > 0);

/* ---- jerarquia de unidades: raiz (la organizacion) > subdirecciones > coordinaciones ---- */

const hijosDeSub  = id => estado.subdirecciones.filter(s => (s.padreId || null) === (id || null));
const raicesSub   = () => hijosDeSub(null);
const tieneCoords = id => estado.coordinaciones.some(c => c.subId === id);

/** Todos los descendientes de una subdirección, ella incluida. */
function ramaDeSub(id) {
  const salida = [];
  (function bajar(x) {
    salida.push(x);
    hijosDeSub(x).forEach(h => bajar(h.id));
  })(id);
  return salida;
}

/** Subdirecciones en el orden del organigrama: cada padre antes que sus hijas. */
function subsEnOrden() {
  const salida = [];
  (function bajar(id) {
    hijosDeSub(id).forEach(s => { salida.push(s); bajar(s.id); });
  })(null);
  // por si alguna quedara fuera del árbol, no se pierde
  estado.subdirecciones.forEach(s => { if (!salida.includes(s)) salida.push(s); });
  return salida;
}

/** ¿Poner a "id" bajo "padre" crearía un ciclo? */
function creaCiclo(id, padre) {
  return !padre ? false : ramaDeSub(id).includes(padre);
}

const etiPorId    = id => estado.etiquetas.find(e => e.id === id) || null;
const etiquetasDe = p => (p.etiquetas || []).map(etiPorId).filter(Boolean);
const nomEtiquetas = p => etiquetasDe(p).map(e => e.nombre).join("; ");

/** Chips de colores para una persona. */
function chipsEtiquetas(p, mini) {
  return etiquetasDe(p).map(e => {
    const c = colorEti(e.color);
    return `<span class="chip chip-eti${mini ? " mini" : ""}"
      style="background:${c.bg};color:${c.fg};border-color:${c.bd}">${esc(e.nombre)}</span>`;
  }).join("");
}

function diasParaFin(p) {
  if (!p.fechaFin) return null;
  const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  const f = new Date(p.fechaFin + "T00:00:00");
  if (isNaN(f)) return null;
  return Math.round((f - hoy) / 86400000);
}

function fechaCorta(f) {
  if (!f) return "";
  const p = f.split("-");
  return p.length === 3 ? p[2] + "/" + p[1] + "/" + p[0] : f;
}

/* =====================================================================
   4. CALCULO DE TOTALES
   ===================================================================== */

function cero() {
  const t = {
    personas: 0, productos: 0,
    prodPorCat: {}, ppto: 0, pptoPorMod: {},
    porMod: {}
  };
  CATEGORIAS.forEach(c => t.prodPorCat[c] = 0);
  MODALIDADES.forEach(m => { t.pptoPorMod[m] = 0; t.porMod[m] = 0; });
  return t;
}

/** Suma a la persona y su costo, sin tocar los productos. */
function acumularPersona(t, p) {
  t.personas++;
  t.ppto += p.salario;
  t.pptoPorMod[p.modalidad] = (t.pptoPorMod[p.modalidad] || 0) + p.salario;
  t.porMod[p.modalidad] = (t.porMod[p.modalidad] || 0) + 1;
}

/** Suma una cantidad de productos con la categoría de la persona. */
function sumarProductos(t, p, n) {
  if (!n) return;
  t.productos += n;
  t.prodPorCat[p.categoria] = (t.prodPorCat[p.categoria] || 0) + n;
}

function acumular(t, p) {
  acumularPersona(t, p);
  sumarProductos(t, p, p.productos);
}

/** Totales calculados solo sobre personal ACTIVO. */
function calcular() {
  const r = {
    global: cero(),
    porCoord: {}, porSub: {}, porSector: {}, porCat: {}, porEti: {},
    globalTodos: cero()          // incluye inactivos, para comparar
  };
  estado.coordinaciones.forEach(c => r.porCoord[c.id] = cero());
  estado.subdirecciones.forEach(s => r.porSub[s.id] = cero());
  estado.etiquetas.forEach(e => r.porEti[e.id] = cero());

  vigentes().forEach(p => {
    acumular(r.globalTodos, p);
    if (!p.activo) return;
    acumular(r.global, p);

    // La persona y su costo pertenecen a su coordinación principal...
    if (r.porCoord[p.coordId]) acumularPersona(r.porCoord[p.coordId], p);
    const s = subDeCoord(p.coordId);
    if (s && r.porSub[s.id]) acumularPersona(r.porSub[s.id], p);

    // ...pero sus productos pueden estar repartidos entre varias.
    repartoDe(p).forEach(x => {
      if (r.porCoord[x.coordId]) sumarProductos(r.porCoord[x.coordId], p, x.productos);
      const sx = subDeCoord(x.coordId);
      if (sx && r.porSub[sx.id]) sumarProductos(r.porSub[sx.id], p, x.productos);
    });
    const sec = p.sector || "(sin sector)";
    if (!r.porSector[sec]) r.porSector[sec] = cero();
    acumular(r.porSector[sec], p);
    const cat = p.categoria || "(sin categoria)";
    if (!r.porCat[cat]) r.porCat[cat] = cero();
    acumular(r.porCat[cat], p);
    // una persona puede llevar varias etiquetas: suma en cada una
    (p.etiquetas || []).forEach(e => { if (r.porEti[e]) acumular(r.porEti[e], p); });
  });
  return r;
}

function pintarKpis(t) {
  const g = t.global, todos = t.globalTodos;
  const inact = vigentes().filter(p => !p.activo).length;

  const prodLeg = g.prodPorCat.Legal || 0;
  const dProd = (todos.prodPorCat.Legal || 0) - prodLeg;
  const dPpto = todos.ppto - g.ppto;
  const tf = vigentes().filter(p => p.activo && p.modalidad === "TF").length;

  const k = (lbl, val, sub) =>
    `<div class="kpi"><div class="k-lbl">${lbl}</div><div class="k-val">${val}</div>
     <div class="k-sub">${sub || "&nbsp;"}</div></div>`;

  const baja = txt => ` · <span class="k-baja">${txt}</span>`;

  // Solo cuatro cifras; el desglose completo está en Resúmenes.
  $("#kpis").innerHTML =
    k("Personal activo", fmtN(g.personas),
      fmtN(tf) + " TF" + (inact ? baja(inact + " desactivado(s)") : "")) +

      dProd ? `<span class="k-baja">-${fmtN(dProd)} por desactivados</span>` : "") +
    k("Presupuesto mensual", fmtS(g.ppto),
      dPpto ? `<span class="k-baja">-${fmtS(dPpto)} por desactivados</span>` : "") +
    k("Presupuesto anual", fmtS(g.ppto * 12), "");

/* Orden de las tarjetas dentro de una coordinación: primero los legales,
   después los técnicos y al final el resto. Dentro de cada grupo va primero
   el jefe de equipo y luego por orden alfabético. */
const ORDEN_CAT = { "Legal": 0, "Técnico": 1, "Economista": 2, "Administrativo": 3 };
const rangoCat = p => ORDEN_CAT[p.categoria] !== undefined ? ORDEN_CAT[p.categoria] : 4;

const ordenTarjetas = (a, b) =>
  rangoCat(a) - rangoCat(b) ||
  (b.rol === "Jefe de equipo") - (a.rol === "Jefe de equipo") ||
  nomPersona(a).localeCompare(nomPersona(b));

/** ¿Esta coordinación tiene un orden puesto a mano? */
const tieneOrdenPropio = coordId =>
  vigentes().some(p => p.coordId === coordId && typeof p.orden === "number");

/** Personal de una coordinación, en el orden en que debe verse. */
function personasDeCoord(coordId) {
  const lista = vigentes().filter(p => p.coordId === coordId);
  return tieneOrdenPropio(coordId)
    ? lista.sort((a, b) => (a.orden ?? 1e9) - (b.orden ?? 1e9) || ordenTarjetas(a, b))
    : lista.sort(ordenTarjetas);
}

/** Fija el orden 0,1,2... a partir de una secuencia ya resuelta. */
function fijarOrden(secuencia) {
  secuencia.forEach((p, i) => { p.orden = i; });
}

/** Devuelve la coordinación a su orden por categoría. */
function ordenPorDefecto(coordId) {
  estado.personas.forEach(p => { if (p.coordId === coordId) delete p.orden; });
  guardar(); render();
  toast("Orden por categoría restablecido");
}

/** Mueve una coordinación una posición a la izquierda o a la derecha. */
function moverCoord(id, paso) {
  const c = coordPorId(id);
  if (!c) return;
  const hermanas = estado.coordinaciones.filter(x => x.subId === c.subId);
  const i = hermanas.indexOf(c), j = i + paso;
  if (j < 0 || j >= hermanas.length) return;
  const gi = estado.coordinaciones.indexOf(hermanas[i]);
  const gj = estado.coordinaciones.indexOf(hermanas[j]);
  estado.coordinaciones[gi] = hermanas[j];
  estado.coordinaciones[gj] = hermanas[i];
  guardar(); render();
}

function tarjeta(p) {
  const d = diasParaFin(p);
  const fin = p.fechaFin
    ? `<span class="c-fin${d !== null && d <= 60 ? " pronto" : ""}">hasta ${fechaCorta(p.fechaFin)}${d !== null && d <= 60 && d >= 0 ? " (" + d + "d)" : ""}${d !== null && d < 0 ? " venc." : ""}</span>`
    : "";
  // Una sola línea gris de datos; el único color de la tarjeta es la barra
  // de categoría, para distinguir de un vistazo técnicos y legales.
  const meta = [esc(p.modalidad) + (p.modalidad === "TF" && p.nivelTF ? " " + esc(p.nivelTF) : "")];
  if (p.categoria) meta.push(`<span class="m-cat">${esc(p.categoria)}</span>`);
  if (p.productos) meta.push(`<b>${fmtN(p.productos)}</b> prod.${tieneReparto(p) ? " en total" : ""}`);
  if (p.sector)    meta.push(esc(p.sector));

  const cat = p.categoria === "Técnico" ? " cat-tecnico"
    : p.categoria === "Legal" ? " cat-legal" : "";

  const otras = (p.jefaturas || []).filter(c => coordPorId(c));
  if (otras.length) meta.push(`<span title="También dirige ${
    otras.map(c => esc(nomCoord(c))).join(", ")}">+${otras.length} equipo${otras.length > 1 ? "s" : ""}</span>`);

  return `<div class="card m-${p.modalidad.toLowerCase()}${cat}${p.rol === "Jefe de equipo" ? " rol-jefe" : ""}${p.activo ? "" : " off"}${
      !p.activo && p.motivoInactivo ? " lic" : ""}"
      draggable="true" data-id="${p.id}" ondblclick="abrirPersona('${p.id}')">
    ${!p.activo && p.motivoInactivo ? `<div class="c-lic" title="${esc(p.motivoInactivo)}${
      p.fechaRetorno ? ", retorna el " + fechaCorta(p.fechaRetorno) : ""}">${
      esc(p.motivoInactivo)}${p.fechaRetorno ? " · hasta " + fechaCorta(p.fechaRetorno) : ""}</div>` : ""}
    <div class="c-acc">
      <button class="ic" title="${p.activo ? "Desactivar" : "Activar"}"
        onclick="event.stopPropagation();alternar('${p.id}')">${ico("encender")}</button>
      <button class="ic" title="Editar" onclick="event.stopPropagation();abrirPersona('${p.id}')">${ico("lapiz")}</button>
      <button class="ic" title="Pasar a personal antiguo"
        onclick="event.stopPropagation();dlgFinContrato('${p.id}')">${ico("salir")}</button>
    </div>
    <div class="c-top">
      <div class="c-nom">${esc(nomPersona(p))}</div>
      ${p.rol === "Jefe de equipo" ? '<span class="c-jefe">Jefe</span>' : ""}
    </div>
    <div class="c-meta">${meta.join('<span class="sep">·</span>')}</div>
    ${tieneReparto(p) ? `<div class="c-reparto">${repartoDe(p)
        .filter(x => x.productos > 0)
        .map(x => `<span>${x.coordId === p.coordId ? "aquí" : esc(nomCoord(x.coordId))}
          <b>${fmtN(x.productos)}</b></span>`).join("")}</div>` : ""}
    ${p.etiquetas && p.etiquetas.length ? `<div class="c-linea c-etis">${chipsEtiquetas(p)}</div>` : ""}
    <div class="c-pie"><span class="c-sueldo">${fmtS(p.salario)}</span>${fin}</div>
  </div>`;
}

function pintarKanban(tot) {
  const cont = $("#v-kanban");
  // Se guarda cuánto estaba desplazada cada subdirección para devolverla igual.
  const posH = {};
  document.querySelectorAll("#v-kanban .cols").forEach(c => {
    posH[c.dataset.sub || ""] = c.scrollLeft;
  });
  if (!estado.subdirecciones.length) {
    cont.innerHTML = `<div class="panel"><div class="nada">No hay subdirecciones.
      Crea la estructura en la pestaña <b>Estructura</b>.</div></div>`;
    return;
  }
  let html = `<p class="hint">Arrastra una tarjeta a otra coordinación para moverla: los productos y el
     presupuesto se recalculan al instante. Doble clic para editar. El círculo apaga o enciende a la
     persona en todos los cálculos.</p>`;

  const sinCoord = vigentes().filter(p => !coordPorId(p.coordId)).sort(ordenTarjetas);

  // Se recorren en el orden del organigrama; las unidades que solo agrupan a
  // otras (sin coordinaciones propias) no ocupan sitio aquí.
  subsEnOrden().filter(s => tieneCoords(s.id) || !hijosDeSub(s.id).length).forEach(s => {
    const t = tot.porSub[s.id] || cero();
    const coords = estado.coordinaciones.filter(c => c.subId === s.id);
    html += `<div class="sub-bloque" data-unidad="${s.id}">
      <div class="sub-cab">
        <div class="sub-nom">${esc(s.nombre)}</div>

          <span class="mini"><b>${fmtN(t.personas)}</b> activos</span>
          <span class="mini" title="${CATEGORIAS.map(c => pluralTit(c) + ": " + fmtN(t.prodPorCat[c] || 0)).join(" · ")}"><b>${fmtN(t.productos)}</b> productos</span>
          <span class="mini mini-fuerte"><b>${fmtS(t.ppto)}</b> al mes</span>
        </div>
      </div>
      <div class="cols" data-sub="${s.id}">`;

    if (!coords.length) {
      html += `<div class="vacio" style="padding:16px">Sin coordinaciones en esta subdirección.</div>`;
    }
    coords.forEach((c, i) => {
      const tc = tot.porCoord[c.id] || cero();
      const gente = personasDeCoord(c.id);
      html += `<div class="col" data-coord="${c.id}" data-unidad="${c.id}">
        <div class="col-cab">
          <div class="col-nom">${esc(c.nombre)}
            <span class="col-acc">
              <button class="ic" title="Mover la coordinación a la izquierda"
                onclick="moverCoord('${c.id}',-1)" ${i === 0 ? "disabled" : ""}>${ico("izq")}</button>
              <button class="ic" title="Mover la coordinación a la derecha"
                onclick="moverCoord('${c.id}',1)" ${i === coords.length - 1 ? "disabled" : ""}>${ico("der")}</button>
              ${tieneOrdenPropio(c.id) ? `<button class="ic" title="Volver al orden por categoría"
                onclick="ordenPorDefecto('${c.id}')">${ico("orden")}</button>` : ""}
              <span class="cnt">${tc.personas}</span>
            </span></div>
          ${bloqueJefeExterno(c.id)}
          ${bloqueCifras(tc, c.id)}
        </div>
        <div class="col-body" data-coord="${c.id}">
          ${gente.length ? gente.map(tarjeta).join("") : '<div class="vacio">Sin personal</div>'}
          ${bloqueAportes(c.id)}
        </div>
        <div class="col-pie">
          <button class="btn btn-out btn-sm" onclick="abrirPersona(null,'${c.id}')">+ Persona</button>
          <button class="btn btn-out btn-sm" onclick="dlgSepararEquipo('${c.id}')">Separar</button>
        </div>
      </div>`;
    });
    html += `</div><div class="barra-h"><div></div></div></div>`;
  });

  if (sinCoord.length) {
    html += `<div class="sub-bloque"><div class="sub-cab">
        <div class="sub-nom" style="color:var(--rojo)">Sin coordinación asignada</div>
        <span class="pill">${sinCoord.length} persona(s)</span></div>
      <div class="cols" data-sub=""><div class="col" data-coord="">
        <div class="col-cab"><div class="col-nom">Pendientes de asignar<span class="cnt">${sinCoord.length}</span></div></div>
        <div class="col-body" data-coord="">${sinCoord.map(tarjeta).join("")}</div>
      </div></div><div class="barra-h"><div></div></div></div>`;
  }

  cont.innerHTML = html;
  document.querySelectorAll("#v-kanban .cols").forEach(c => {
    const x = posH[c.dataset.sub || ""];
    if (x) c.scrollLeft = x;
  });
  activarArrastre();
  sincronizarBarras();
}

/** Ajusta el ancho y la visibilidad de cada barra fija. */
function medirBarras() {
  document.querySelectorAll("#v-kanban .sub-bloque").forEach(bloque => {
    const cols = bloque.querySelector(".cols");
    const barra = bloque.querySelector(".barra-h");
    if (!cols || !barra) return;
    barra.firstElementChild.style.width = cols.scrollWidth + "px";
    barra.classList.toggle("oculta", cols.scrollWidth - cols.clientWidth <= 1);
    if (Math.abs(barra.scrollLeft - cols.scrollLeft) >= 0.5) barra.scrollLeft = cols.scrollLeft;
  });
}

let obsBarras = null;

/** Enlaza cada barra fija con el desplazamiento real de sus columnas. */
function sincronizarBarras() {
  if (obsBarras) obsBarras.disconnect();
  obsBarras = window.ResizeObserver ? new ResizeObserver(medirBarras) : null;

  document.querySelectorAll("#v-kanban .sub-bloque").forEach(bloque => {
    const cols = bloque.querySelector(".cols");
    const barra = bloque.querySelector(".barra-h");
    if (!cols || !barra) return;

    // Se comparan valores en vez de usar banderas: al igualarlos, el evento
    // que dispara la otra caja no encuentra diferencia y la cadena se corta.
    const iguales = () => Math.abs(barra.scrollLeft - cols.scrollLeft) < 0.5;
    barra.addEventListener("scroll", () => { if (!iguales()) cols.scrollLeft = barra.scrollLeft; });
    cols.addEventListener("scroll", () => { if (!iguales()) barra.scrollLeft = cols.scrollLeft; });

    if (obsBarras) obsBarras.observe(cols);
  });

  medirBarras();
  requestAnimationFrame(medirBarras);
}

window.addEventListener("resize", medirBarras);

/* ------------------------------- arrastrar y soltar ------------------- */

function activarArrastre() {
  let idArrastrado = null;

  document.querySelectorAll("#v-kanban .card").forEach(el => {
    el.addEventListener("dragstart", e => {
      idArrastrado = el.dataset.id;
      e.dataTransfer.setData("text/plain", idArrastrado);
      e.dataTransfer.effectAllowed = "move";
      setTimeout(() => el.classList.add("arrastrando"), 0);
    });
    el.addEventListener("dragend", () => {
      el.classList.remove("arrastrando");
      document.querySelectorAll(".col.drop").forEach(c => c.classList.remove("drop"));
    });
  });

  /** Tarjeta sobre la que se esta soltando y si va antes o despues de ella. */
  const destinoEn = (col, y) => {
    const tarjetas = Array.from(col.querySelectorAll(".card:not(.arrastrando)"));
    for (const el of tarjetas) {
      const r = el.getBoundingClientRect();
      if (y < r.top + r.height / 2) return { el, antes: true };
    }
    const ultima = tarjetas[tarjetas.length - 1];
    return ultima ? { el: ultima, antes: false } : null;
  };

  const limpiarMarcas = () =>
    document.querySelectorAll(".card.antes, .card.despues")
      .forEach(c => c.classList.remove("antes", "despues"));

  document.querySelectorAll("#v-kanban .col").forEach(col => {
    const zona = col.querySelector(".col-body") || col;
    const marcar = e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      col.classList.add("drop");
      limpiarMarcas();
      const d = destinoEn(col, e.clientY);
      if (d) d.el.classList.add(d.antes ? "antes" : "despues");
    };
    zona.addEventListener("dragover", marcar);
    col.addEventListener("dragover", marcar);
    col.addEventListener("dragleave", e => {
      if (!col.contains(e.relatedTarget)) { col.classList.remove("drop"); limpiarMarcas(); }
    });
    const soltar = e => {
      e.preventDefault();
      e.stopPropagation();
      col.classList.remove("drop");
      const d = destinoEn(col, e.clientY);
      limpiarMarcas();
      const id = e.dataTransfer.getData("text/plain") || idArrastrado;
      colocarPersona(id, col.dataset.coord || null, d);
    };
    zona.addEventListener("drop", soltar);
    col.addEventListener("drop", soltar);
  });
}

/** Mueve a la persona a una coordinación y, dentro de ella, a una posición. */
function colocarPersona(id, coordId, destino) {
  const p = estado.personas.find(x => x.id === id);
  if (!p) return;
  const cambiaDeEquipo = p.coordId !== coordId;

  // La secuencia actual del destino, sin la persona que se esta moviendo.
  const secuencia = personasDeCoord(coordId).filter(x => x.id !== id);
  let pos = secuencia.length;
  if (destino) {
    const ref = secuencia.findIndex(x => x.id === destino.el.dataset.id);
    if (ref >= 0) pos = destino.antes ? ref : ref + 1;
  }

  p.coordId = coordId;
  // Si ya dirigia este equipo como jefatura adicional, ahora es el principal.
  p.jefaturas = (p.jefaturas || []).filter(j => j !== coordId);
  secuencia.splice(pos, 0, p);
  fijarOrden(secuencia);

  guardar();
  render();
  if (cambiaDeEquipo) {
    toast(nomPersona(p) + " -> " + (coordId ? nomCoord(coordId) : "sin coordinación"));
  } else {
    toast(nomPersona(p) + ": posición " + (pos + 1) + " de " + secuencia.length);
  }
}


function alternar(id) {
  const p = estado.personas.find(x => x.id === id);
  if (!p) return;
  p.activo = !p.activo;
  // Al volver a contar se limpia la licencia: si sigue de licencia, se marca
  // desde la ficha, que es donde se elige el motivo.
  if (p.activo) { p.motivoInactivo = ""; p.fechaRetorno = ""; }
  guardar();
  render();
  toast(nomPersona(p) + (p.activo ? " vuelve a contar" : " ya no se cuenta en los cálculos"));
}

function personasFiltradas() {
  const q = filtros.texto.trim().toLowerCase();
  return vigentes().filter(p => {
    if (!filtros.verInactivos && !p.activo) return false;
    if (filtros.modalidad && p.modalidad !== filtros.modalidad) return false;
    if (filtros.categoria && p.categoria !== filtros.categoria) return false;
    if (filtros.sector && p.sector !== filtros.sector) return false;
    if (filtros.rol && p.rol !== filtros.rol) return false;
    if (filtros.coord && p.coordId !== filtros.coord) return false;
    if (filtros.sub) { const s = subDeCoord(p.coordId); if (!s || s.id !== filtros.sub) return false; }
    if (filtros.etiqueta) {
      if (filtros.etiqueta === "__sin__") { if ((p.etiquetas || []).length) return false; }
      else if (!(p.etiquetas || []).includes(filtros.etiqueta)) return false;
    }
    if (q) {
      const txt = [nomPersona(p), p.carrera, p.categoria, p.sector, nomCoord(p.coordId),
                   nomSub(p.coordId), p.modalidad, nomEtiquetas(p)].join(" ").toLowerCase();
      if (!txt.includes(q)) return false;
    }
    return true;
  }).sort((a, b) => nomSub(a.coordId).localeCompare(nomSub(b.coordId)) ||
                    nomCoord(a.coordId).localeCompare(nomCoord(b.coordId)) ||
                    nomPersona(a).localeCompare(nomPersona(b)));
}

function opciones(lista, sel, vacio) {
  return `<option value="">${vacio}</option>` + lista.map(o => {
    const v = typeof o === "string" ? o : o.id;
    const n = typeof o === "string" ? o : o.nombre;
    return `<option value="${esc(v)}"${sel === v ? " selected" : ""}>${esc(n)}</option>`;
  }).join("");
}

    <div class="campo"><label>Coordinación</label><select id="f-coord">${opciones(estado.coordinaciones, filtros.coord, "Todas")}</select></div>

  const enlazar = (id, campo, ev) => {
    const el = $("#" + id); if (!el) return;
    el.addEventListener(ev || "change", e => {
      filtros[campo] = e.target.type === "checkbox" ? e.target.checked : e.target.value;
      pintarPersonal();
      if (ev === "input") { const n = $("#" + id); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }

  enlazar("f-sub", "sub"); enlazar("f-coord", "coord"); enlazar("f-rol", "rol");
  enlazar("f-eti", "etiqueta");
  enlazar("f-inact", "verInactivos");
}

function limpiarFiltros() {
  filtros = { texto: "", modalidad: "", categoria: "", sector: "", coord: "", sub: "",
              rol: "", etiqueta: "", verInactivos: true };
