const ALIAS_MOD = { "tf": "TF", "tercero fiscalizador": "TF", "tercero": "TF",
                    "locador": "LOCADOR", "locadores": "LOCADOR",
                    "locacion de servicios": "LOCADOR", "locador de servicios": "LOCADOR",
                    "cas": "CAS", "servir": "SERVIR",
                    "practicante": "PRACTICANTE", "practicantes": "PRACTICANTE",
                    "secigrista": "SECIGRISTA", "secigristas": "SECIGRISTA",
                    "secigra": "SECIGRISTA" };

/** dd/mm/aaaa, aaaa-mm-dd o fecha real de Excel -> aaaa-mm-dd */
function fechaISO(v) {
  const s = String(v == null ? "" : v).trim();
  if (!s) return "";
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return `${m[1]}-${m[2].padStart(2, "0")}-${m[3].padStart(2, "0")}`;
  m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/);
  if (m) return `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
  return "";
}

/** Convierte las hojas del Excel en fichas listas para revisar. */
function leerHojasPersonal(hojas) {
  const personas = [], avisos = [], resumenHojas = [];

  // La hoja "Historial" no trae fichas: trae periodos que se cuelgan de cada persona.
  const historialPorNombre = {};
  Object.keys(hojas).filter(n => canon(n) === "historial").forEach(nombreHoja => {
    const filas = hojas[nombreHoja];
    if (!filas || filas.length < 2) return;
    const cab = filas[0].map(canon);
    const col = k => cab.indexOf(k);
    const iN = col("nombre"), iA = col("apellido");
    if (iN < 0) { avisos.push(`La hoja "${nombreHoja}" no tiene columna "Nombre": se omitió.`); return; }
    filas.slice(1).forEach(f => {
      const clave = claveNombre(String(f[iN] || ""), iA >= 0 ? String(f[iA] || "") : "");
      if (!clave) return;
      const g = i => i >= 0 ? f[i] : "";
      (historialPorNombre[clave] = historialPorNombre[clave] || []).push({
        orden: Number(g(col("periodo"))) || 0,
        inicio: fechaISO(g(col("inicio"))), fin: fechaISO(g(col("fin"))),
        motivo: String(g(col("motivo de cese")) || g(col("motivo")) || "").trim(),
        modalidad: String(g(col("modalidad")) || "").trim().toUpperCase(),
        nivelTF: String(g(col("nivel tf")) || "").trim().toUpperCase(),
        coordinacion: String(g(col("coordinacion")) || "").trim(),
        observacion: String(g(col("observacion")) || "").trim()
      });
    });
  });
  Object.values(historialPorNombre).forEach(l => l.sort((a, b) => a.orden - b.orden));

  Object.keys(hojas).filter(n => canon(n) !== "historial").forEach(nombreHoja => {
    const filas = hojas[nombreHoja];
    if (!filas || filas.length < 2) {
      avisos.push(`La hoja "${nombreHoja}" no tiene filas de datos.`);
      return;
    }
    const esHojaAntiguos = canon(nombreHoja).startsWith("personal antiguo");
    const cab = filas[0].map(canon);
    const idx = {}, colsEtiqueta = [];
    let iEtiquetas = -1;

    cab.forEach((h, i) => {
      const campo = CAMPOS_IMP[h];
      if (campo === "etiquetas") iEtiquetas = i;
      if (campo && campo !== "ignorar" && idx[campo] === undefined) idx[campo] = i;
    });
    // Las columnas sin encabezado conocido que van después de "Etiquetas"
    // son las columnas SI/NO de cada etiqueta.
    cab.forEach((h, i) => {
      if (iEtiquetas >= 0 && i > iEtiquetas && h && !CAMPOS_IMP[h]) {
        colsEtiqueta.push({ i, nombre: String(filas[0][i]).trim() });
      }
    });

    if (idx.nombre === undefined && idx.nombreCompleto === undefined) {
      avisos.push(`La hoja "${nombreHoja}" no tiene columna "Nombre": se omitió.`);
      return;
    }

    let leidas = 0, omitidas = 0;
    filas.slice(1).forEach((f, n) => {
      const dato = k => idx[k] === undefined ? "" : f[idx[k]];
      const fila = n + 2;

      let nombre = String(dato("nombre") || "").trim();
      let apellido = String(dato("apellido") || "").trim();
      if (!nombre && idx.nombreCompleto !== undefined) {
        const partes = String(dato("nombreCompleto") || "").trim().split(/\s+/);
        nombre = partes.shift() || "";
        apellido = partes.join(" ");
      }
      if (!nombre && !apellido) { omitidas++; return; }

      const modBruta = canon(dato("modalidad"));
      const modalidad = ALIAS_MOD[modBruta] ||
        MODALIDADES.find(m => canon(m) === modBruta) || "";
      if (!modalidad) {
        avisos.push(`${nombreHoja}, fila ${fila}: modalidad "${dato("modalidad")}" no reconocida, se omitió a ${nombre} ${apellido}.`);
        omitidas++; return;
      }

      const catBruta = String(dato("categoria") || "").trim();
      const categoria = CATEGORIAS.find(c => canon(c) === canon(catBruta)) || catBruta;
      const rol = ROLES.find(r => canon(r) === canon(dato("rol"))) || "Analista";
      const nivelBruto = String(dato("nivelTF") || "").trim().toUpperCase();

      const etis = [];
      String(dato("etiquetas") || "").split(";").forEach(e => {
        const v = e.trim(); if (v) etis.push(v);
      });
      colsEtiqueta.forEach(c => {
        if (canon(f[c.i]) === "si" && c.nombre && !etis.some(x => canon(x) === canon(c.nombre)))
          etis.push(c.nombre);
      });

      // "Coord A: 8; Coord B: 4" -> lista de nombres y cantidades
      const reparto = [];
      String(dato("reparto") || "").split(";").forEach(trozo => {
        const m = String(trozo).match(/^\s*(.+?)\s*:\s*(\d+(?:[.,]\d+)?)\s*$/);
        if (m) reparto.push({ coordNombre: m[1].trim(), productos: Math.round(Number(m[2].replace(",", "."))) });
      });

      // "Coord A; Coord B" -> equipos que esta persona tambien dirige
      const jefaturas = String(dato("jefaturas") || "").split(";")
        .map(x => x.trim()).filter(Boolean);

      const activo = !["no", "0", "false", "n"].includes(canon(dato("activo")));
      const motInacBruto = String(dato("motivoInactivo") || "").trim();
      const motivoInactivo = activo ? ""
        : (MOTIVOS_INACTIVO.find(m => canon(m) === canon(motInacBruto)) || motInacBruto);

      const fAnt = fechaISO(dato("fechaAntiguo"));
      const motivoBruto = String(dato("motivoCese") || "").trim();
      const motivoCese = MOTIVOS_CESE.find(m => canon(m) === canon(motivoBruto)) || motivoBruto;
      const fCese = fechaISO(dato("fechaCese"));
      personas.push({
        nombre, apellido, modalidad,
        nivelTF: modalidad === "TF" && NIVELES_TF.includes(nivelBruto) ? nivelBruto : "",
        productos: Math.max(0, Math.round(Number(dato("productos")) || 0)),
        salario: Math.max(0, Number(dato("salario")) || 0),
        carrera: String(dato("carrera") || "").trim(),
        categoria, rol,
        sector: String(dato("sector") || "").trim(),
        coordNombre: String(dato("coord") || "").trim(),
        subNombre: String(dato("sub") || "").trim(),
        fechaInicio: fechaISO(dato("fechaInicio")),
        fechaFin: fechaISO(dato("fechaFin")),
        reparto, jefaturas,
        dni: String(dato("dni") || "").trim().replace(/\.0$/, ""),
        celular: String(dato("celular") || "").trim().replace(/\.0$/, ""),
        usuarioInaf: String(dato("usuarioInaf") || "").trim().toUpperCase(),
        nroContrato: String(dato("nroContrato") || "").trim(),
        teletrabajo: String(dato("teletrabajo") || "").trim(),
        anioIngreso: (String(dato("anioIngreso") || "").match(/\d{4}/) || [""])[0],
        motivoInactivo, fechaRetorno: activo ? "" : fechaISO(dato("fechaRetorno")),
        activo,
        antiguo: esHojaAntiguos || !!fAnt,
        fechaAntiguo: fAnt || (esHojaAntiguos ? hoyISO() : ""),
        motivoCese: esHojaAntiguos || fAnt ? motivoCese : "",
        fechaCese: esHojaAntiguos || fAnt ? fCese : "",
        observaciones: String(dato("observaciones") || "").trim(),
        historial: (historialPorNombre[claveNombre(nombre, apellido)] || [])
          .map(({ orden, ...h }) => h),
        etiquetas: etis
      });
      leidas++;
    });
    resumenHojas.push({ nombre: nombreHoja, leidas, omitidas, antiguos: esHojaAntiguos });
  });

  return { personas, avisos, resumenHojas };
}

let importPendiente = null;

async function importarExcel() {
  if (!hayApi) { toast("Disponible en la aplicación de escritorio", true); return; }
  const r = await window.pywebview.api.importar_excel();
  if (!r.ok) { if (!r.cancelado) toast("No se pudo leer: " + r.error, true); return; }
  const hojas = r.hojas || {};
  if (!Object.keys(hojas).length) {
    toast('El archivo no tiene ninguna hoja llamada "Personal"', true); return;
  }
  const lect = leerHojasPersonal(hojas);
  if (!lect.personas.length) {
    abrirModal("No se pudo importar",
      `<div class="aviso">El archivo se leyó, pero no se obtuvo ninguna ficha válida.</div>
       ${lect.avisos.length ? `<ul style="font-size:12.5px;line-height:1.6">${
         lect.avisos.map(a => `<li>${esc(a)}</li>`).join("")}</ul>` : ""}`,
      `<button class="btn btn-out" onclick="cerrar()">Cerrar</button>`, true);
    return;
  }
  importPendiente = lect;
  dlgImportar(r.ruta);
}

function dlgImportar(ruta) {
  const L = importPendiente;
  const nuevos = { sub: new Set(), coord: new Set(), sector: new Set(), eti: new Set() };
  L.personas.forEach(p => {
    if (p.subNombre && !estado.subdirecciones.some(s => canon(s.nombre) === canon(p.subNombre)))
      nuevos.sub.add(p.subNombre);
    if (p.coordNombre && !estado.coordinaciones.some(c => canon(c.nombre) === canon(p.coordNombre)))
      nuevos.coord.add(p.coordNombre);
    if (p.sector && !estado.sectores.some(s => canon(s) === canon(p.sector)))
      nuevos.sector.add(p.sector);
    p.etiquetas.forEach(e => {
      if (!estado.etiquetas.some(x => canon(x.nombre) === canon(e))) nuevos.eti.add(e);
    });
  });
  const repetidos = L.personas.filter(p =>
    buscarHomonimo(p.nombre, p.apellido, null)).length;
  const antiguos_ = L.personas.filter(p => p.antiguo).length;

  const linea = (et, v) => `<tr><td>${et}</td><td class="num"><b>${v}</b></td></tr>`;
  const listaNuevos = (et, set) => set.size
    ? `<tr><td>${et}</td><td class="num"><b>${set.size}</b><div style="font-weight:400;font-size:11.5px;color:var(--tinta2);max-width:340px;white-space:normal">${
        esc(Array.from(set).join(", "))}</div></td></tr>` : "";

  abrirModal("Importar desde Excel",
    `<div class="hint" style="margin:0 0 10px">Archivo: <b>${esc(String(ruta).split(/[\\/]/).pop())}</b></div>
     <div class="panel" style="margin-bottom:12px"><div class="tabla-wrap"><table><tbody>
       ${L.resumenHojas.map(h => linea(
          `Hoja "${esc(h.nombre)}"${h.antiguos ? " (personal antiguo)" : ""}`,
          `${h.leidas} leída(s)${h.omitidas ? ` · ${h.omitidas} omitida(s)` : ""}`)).join("")}
       ${linea("Fichas a importar", L.personas.length)}
       ${antiguos_ ? linea("De ellas, personal antiguo", antiguos_) : ""}
       ${listaNuevos("Subdirecciones nuevas", nuevos.sub)}
       ${listaNuevos("Coordinaciones nuevas", nuevos.coord)}
       ${listaNuevos("Sectores nuevos", nuevos.sector)}
       ${listaNuevos("Etiquetas nuevas", nuevos.eti)}
       ${repetidos ? linea("Nombres que ya existen aquí", repetidos) : ""}
     </tbody></table></div></div>
     ${L.avisos.length ? `<div class="aviso"><b>Avisos:</b><ul style="margin:6px 0 0;padding-left:18px">${
        L.avisos.slice(0, 12).map(a => `<li>${esc(a)}</li>`).join("")}${
        L.avisos.length > 12 ? `<li>y ${L.avisos.length - 12} más...</li>` : ""}</ul></div>` : ""}
     <div class="hint"><b>Agregar</b> conserva lo actual y suma las fichas del archivo${
       repetidos ? `, saltando los ${repetidos} nombre(s) que ya existen` : ""}.
       <b>Completar y agregar</b> hace lo mismo y además rellena los campos que estén vacíos
       en las fichas que ya existen: no pisa ningún dato tuyo ni mueve a nadie de coordinación.
       <b>Reemplazar</b> borra lo que hay ahora y deja solo lo del archivo.
       Las coordinaciones, subdirecciones, sectores y etiquetas que falten se crean solas.</div>`,
    `<button class="btn btn-out" onclick="cerrar()">Cancelar</button>
     <button class="btn btn-out" onclick="aplicarImportacion('agregar')">Agregar a lo actual</button>
     ${repetidos ? `<button class="btn btn-accion"
       onclick="aplicarImportacion('completar')">Completar y agregar</button>` : ""}
     <button class="btn btn-out"
       onclick="confirmarReemplazo()">Reemplazar todo</button>`);
}

function confirmarReemplazo() {
  const n = estado.personas.length;
  confirmar("Reemplazar todos los datos",
    `Se borrarán las <b>${n} ficha(s)</b> actuales y toda la estructura, y quedará solo lo que
     traiga el archivo. Si aún no hiciste un <b>Respaldo</b>, cancela y hazlo primero.`,
    () => aplicarImportacion("reemplazar"));
}

function aplicarImportacion(modo) {
  const L = importPendiente;
  if (!L) { cerrar(); return; }
  const reemplazar = modo === "reemplazar";

  const subs    = reemplazar ? [] : estado.subdirecciones.slice();
  const coords  = reemplazar ? [] : estado.coordinaciones.slice();
  const sects   = reemplazar ? [] : estado.sectores.slice();
  const etis    = reemplazar ? [] : estado.etiquetas.slice();
  const base    = reemplazar ? [] : estado.personas.slice();

  const subId = nom => {
    if (!nom || canon(nom).startsWith("(sin")) return null;
    let s = subs.find(x => canon(x.nombre) === canon(nom));
    if (!s) { s = { id: uid(), nombre: nom }; subs.push(s); }
    return s.id;
  };
  const coordId = (nom, nomSub) => {
    if (!nom || canon(nom).startsWith("(sin")) return null;
    const sid = subId(nomSub);
    let c = coords.find(x => canon(x.nombre) === canon(nom) &&
                             (sid === null || x.subId === sid));
    if (!c) c = coords.find(x => canon(x.nombre) === canon(nom) && !x.subId);
    if (!c) { c = { id: uid(), nombre: nom, subId: sid }; coords.push(c); }
    else if (sid && !c.subId) c.subId = sid;
    return c.id;
  };
  /* Una coordinación nombrada solo dentro de un reparto se busca por nombre a
     secas; si no existe, se crea bajo la subdirección de quien reparte, para que
     nunca quede huérfana y sin sitio donde verse. */
  const coordDeReparto = (nom, subRespaldo) => {
    if (!nom || canon(nom).startsWith("(sin")) return null;
    const c = coords.find(x => canon(x.nombre) === canon(nom));
    if (c) return c.id;
    return coordId(nom, subRespaldo);
  };

  const etiId = nom => {
    let e = etis.find(x => canon(x.nombre) === canon(nom));
    if (!e) {
      e = { id: uid(), nombre: nom, color: COLORES_ETI[etis.length % COLORES_ETI.length].id };
      etis.push(e);
    }
    return e.id;
  };

  // Primero todas las coordinaciones principales, con su subdirección correcta.
  L.personas.forEach(p => coordId(p.coordNombre, p.subNombre));

  let creadas = 0, saltadas = 0, completadas = 0, campos = 0;
  const porClave = {};
  base.forEach(p => { porClave[claveNombre(p.nombre, p.apellido)] = p; });
  const yaHay = new Set(Object.keys(porClave));

  /* Modo completar: la ficha que ya existe manda. Solo se llena lo que esta
     vacio, nunca se pisa un dato puesto a mano, y la coordinacion no se toca
     porque los traslados los decide quien mueve las tarjetas. */
  const completar = (destino, p) => {
    let n = 0;
    const poner = (campo, valor) => {
      if (valor === "" || valor === null || valor === undefined) return;
      const actual = destino[campo];
      if (actual === "" || actual === null || actual === undefined) { destino[campo] = valor; n++; }
    };
    ["carrera", "categoria", "sector", "fechaInicio", "fechaFin", "observaciones",
     "dni", "celular", "usuarioInaf", "nroContrato", "teletrabajo", "anioIngreso"]
      .forEach(k => poner(k, p[k]));
    if (destino.modalidad === "TF" && !destino.nivelTF && p.nivelTF) { destino.nivelTF = p.nivelTF; n++; }
    if (!destino.salario && p.salario) { destino.salario = p.salario; n++; }
    if (!destino.productos && p.productos) { destino.productos = p.productos; n++; }
    // Una licencia es un hecho, no una simulacion: si el archivo la trae y la
    // ficha no tenia motivo, se aplica y la persona deja de contar.
    if (p.motivoInactivo && !destino.motivoInactivo) {
      destino.motivoInactivo = p.motivoInactivo;
      destino.fechaRetorno = p.fechaRetorno || "";
      destino.activo = false;
      n++;
    }
    if (p.sector && !sects.some(x => canon(x) === canon(p.sector))) sects.push(p.sector);
    // Etiquetas y jefaturas se suman a las que ya tenia.
    p.etiquetas.forEach(nom => {
      const id = etiId(nom);
      if (!(destino.etiquetas || []).includes(id)) { destino.etiquetas = (destino.etiquetas || []).concat(id); n++; }
    });
    (p.jefaturas || []).forEach(nom => {
      const id = coordDeReparto(nom, p.subNombre);
      if (id && id !== destino.coordId && !(destino.jefaturas || []).includes(id)) {
        destino.jefaturas = (destino.jefaturas || []).concat(id); n++;
      }
    });
    if (!(destino.repartos || []).length && (p.reparto || []).length) {
      destino.repartos = p.reparto
        .map(x => ({ coordId: coordDeReparto(x.coordNombre, p.subNombre), productos: x.productos }))
        .filter(x => x.coordId && x.coordId !== destino.coordId && x.productos > 0);
      if (destino.repartos.length) n++;
    }
    if (!(destino.historial || []).length && (p.historial || []).length) {
      destino.historial = p.historial; n++;
    }
    return n;
  };

  L.personas.forEach(p => {
    const clave = claveNombre(p.nombre, p.apellido);
    if (!reemplazar && yaHay.has(clave)) {
      if (modo === "completar" && porClave[clave]) {
        const n = completar(porClave[clave], p);
        if (n) { completadas++; campos += n; } else saltadas++;
      } else saltadas++;
      return;
    }
    yaHay.add(clave);
    if (p.sector && !sects.some(s => canon(s) === canon(p.sector))) sects.push(p.sector);
    base.push({
      id: uid(),
      nombre: p.nombre, apellido: p.apellido, modalidad: p.modalidad, nivelTF: p.nivelTF,
      productos: p.productos, salario: p.salario, carrera: p.carrera,
      categoria: p.categoria, sector: p.sector,
      coordId: coordId(p.coordNombre, p.subNombre),
      repartos: (p.reparto || [])
        .filter(x => canon(x.coordNombre) !== canon(p.coordNombre) && x.productos > 0)
        .map(x => ({ coordId: coordDeReparto(x.coordNombre, p.subNombre), productos: x.productos }))
        .filter(x => x.coordId),
      jefaturas: (p.jefaturas || [])
        .map(nom => coordDeReparto(nom, p.subNombre))
        .filter(x => x && x !== coordId(p.coordNombre, p.subNombre)),
      rol: p.rol, fechaInicio: p.fechaInicio, fechaFin: p.fechaFin,
      activo: p.activo, antiguo: p.antiguo,
      motivoInactivo: p.motivoInactivo || "", fechaRetorno: p.fechaRetorno || "",
      dni: p.dni || "", celular: p.celular || "", usuarioInaf: p.usuarioInaf || "",
      nroContrato: p.nroContrato || "", teletrabajo: p.teletrabajo || "",
      anioIngreso: p.anioIngreso || "",
      motivoCese: p.motivoCese || "", fechaCese: p.fechaCese || "",
      observaciones: p.observaciones || "", historial: p.historial || [],
      ...(p.antiguo ? { fechaAntiguo: p.fechaAntiguo } : {}),
      etiquetas: p.etiquetas.map(etiId)
    });
    porClave[clave] = base[base.length - 1];
    creadas++;
  });

  estado = normalizar({
    version: 1, organizacion: estado.organizacion, sectores: sects, subdirecciones: subs,
    coordinaciones: coords, etiquetas: etis, personas: base, org: estado.org
  });
  importPendiente = null;
  guardar(true); cerrar(); render();
  toast(`${creadas} ficha(s) nueva(s)` +
    (completadas ? ` · ${completadas} completada(s) con ${campos} dato(s)` : "") +
    (saltadas ? ` · ${saltadas} sin cambios` : ""));
}

async function respaldar() {
  if (!hayApi) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(estado, null, 1)], { type: "application/json" }));
    a.download = "respaldo_personal.json";
    a.click();
    return;
  }
  const hoy = new Date().toISOString().slice(0, 10);
  const r = await window.pywebview.api.exportar_respaldo(estado, "respaldo_personal_" + hoy + ".json");
  if (r.ok) toast("Respaldo guardado en " + r.ruta);
  else if (!r.cancelado) toast("No se pudo respaldar: " + r.error, true);
}

async function restaurar() {
  if (!hayApi) { toast("Disponible en la aplicación de escritorio", true); return; }
  const r = await window.pywebview.api.importar_respaldo();
  if (!r.ok) { if (!r.cancelado) toast("No se pudo leer: " + r.error, true); return; }
  confirmar("Restaurar respaldo",
    "Los datos actuales serán <b>reemplazados</b> por el contenido del archivo elegido.", () => {
      estado = normalizar(r.datos);
      guardar(true); render(); toast("Datos restaurados");
    });
}
</script>
<script>
/* =====================================================================
   COMPORTAMIENTO PROPIO DE LA VERSIÓN GITHUB PAGES
   ---------------------------------------------------------------------
   Todo lo de arriba es idéntico al .exe. Aquí abajo cambia lo que tiene
   que ver con la base como archivo: importarla, exportarla, avisar de los
   cambios que todavía no están en ningún archivo y olvidarla de este
   navegador cuando se termina.
   ===================================================================== */
(function () {
  const marca = () => document.getElementById("rutaDatos");

  WEBP.alCambiar = function () {
    const el = marca();
    if (!el) return;
    const nombre = WEBP.nombre || (WEBP.sinBase ? "sin base" : "base sin nombre");
    el.textContent = nombre + (WEBP.sucio ? " · cambios sin exportar" : "");
    el.style.color = WEBP.sucio ? "var(--ambar)" : "";
    const b = document.getElementById("btnExportarBase");
    if (b) b.classList.toggle("btn-p", WEBP.sucio);
  };

  /* La versión que se acaba de importar o exportar pasa a ser la "limpia". */
  function fijarLimpia(nombre) {
    WEBP.nombre = nombre;
    WEBP.sinBase = false;
    WEBP.exportado = JSON.stringify(estado);
    guardar(true);
  }

  respaldar = function () {
    const nombre = "base_personal_" + hoyISO() + ".json";
    WEBP.descargar(JSON.stringify(estado, null, 1), nombre, "application/json");
    fijarLimpia(nombre);
    toast("Base exportada: " + nombre + " (carpeta Descargas)");
  };

  restaurar = async function () {
    const r = await window.pywebview.api.importar_respaldo();
    if (!r.ok) { if (!r.cancelado) toast("No se pudo leer: " + r.error, true); return; }
    const cargar = () => {
      estado = normalizar(r.datos);
      fijarLimpia(r.ruta);
      aplicarTema(); pintarTabs(); render();
      toast("Base importada: " + r.datos.personas.length + " ficha(s)");
    };
    if (!estado.personas.length && !WEBP.sucio) { cargar(); return; }
    confirmar("Importar base",
      "Los datos que tienes en pantalla serán <b>reemplazados</b> por los de <b>" + esc(r.ruta) + "</b>" +
      (WEBP.sucio ? ".<br><br>Ojo: tienes cambios que <b>no exportaste</b> y se perderán." : "."), cargar);
  };

  WEBP.olvidar = function () {
    confirmar("Olvidar la base en este navegador",
      "Se borra la copia que este navegador guarda para no perder el trabajo al recargar. " +
      "Úsalo al terminar en una computadora que no es tuya." +
      (WEBP.sucio ? "<br><br>Ojo: tienes cambios que <b>no exportaste</b> y se perderán." : ""), () => {
        try { localStorage.removeItem(WEBP.clave); } catch (e) {}
        WEBP.sucio = false;
        location.reload();
      });
  };

  function bienvenida() {
    abrirModal("Gestor de Personal",
      `<div class="hint" style="font-size:13.5px;line-height:1.6">Para empezar, importa la base:
         el archivo <b>.json</b> que exporta esta página, el <b>datos_personal.json</b> del
         ejecutable o un respaldo suyo.</div>
       <div class="hint" style="margin-top:12px;line-height:1.6">El archivo se lee aquí mismo,
         en tu navegador: no se sube a ningún servidor. Cuando termines, pulsa
         <b>Exportar base</b> para descargar una copia con tus cambios.</div>`,
      `<button class="btn btn-out" onclick="cerrar()">Empezar con una base vacía</button>
       <button class="btn btn-accion" onclick="cerrar();restaurar()">Importar base</button>`, true);
  }

  // Cerrar la pestaña con cambios sin exportar pide confirmación.
  window.addEventListener("beforeunload", e => {
    if (WEBP.sucio) { e.preventDefault(); e.returnValue = ""; }
  });

  window.addEventListener("load", () => setTimeout(() => {
    WEBP.alCambiar();
    if (estado && !estado.personas.length) bienvenida();
  }, 400));
})();

</script>
